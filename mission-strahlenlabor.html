<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Strahlenlabor · Physik 9F</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{--blau:#164A9C;--dblau:#0E2F66;--hblau:#1C69D4;--fblau:#EAF0FA;--orange:#E8833A;--dorange:#B4561A;--horange:#FFF1E4;--rot:#E2231A;--violett:#7A4FD0;--gruen:#2E9E4F;--a:#E8833A;--b:#1C69D4;--g:#2E9E4F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Lexend',system-ui,sans-serif;background:#f4f7fc;color:#1d2433;display:flex;flex-direction:column;min-height:100vh}
h1,h2,h3,.fred{font-family:'Fredoka','Lexend',sans-serif;font-weight:600}
header{background:var(--dblau);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px}
header img{width:46px;height:46px;border-radius:50%;border:2px solid #fff;object-fit:cover;object-position:top;background:#fff}
header .t{font-family:Fredoka;font-weight:600;font-size:clamp(18px,2.6vw,26px)}
header .s{font-size:13px;opacity:.85}
header .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.stripe{height:6px;background:linear-gradient(90deg,var(--hblau) 0 33.3%,var(--dblau) 33.3% 66.6%,var(--rot) 66.6% 100%)}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:16px}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(14,47,102,.12);width:min(1100px,100%);padding:clamp(16px,3vw,32px);position:relative}
.btn{font-family:Lexend;font-weight:700;border:none;border-radius:14px;padding:14px 24px;font-size:clamp(16px,1.9vw,20px);cursor:pointer;color:#fff;background:var(--blau);box-shadow:0 4px 0 var(--dblau)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dblau)}
.btn.or{background:var(--orange);box-shadow:0 4px 0 var(--dorange)}
.btn[disabled]{opacity:.4;cursor:default}
.start{display:flex;gap:28px;align-items:center}
.start img{height:clamp(170px,32vh,320px)}
.start h1{color:var(--blau);font-size:clamp(30px,5vw,54px);line-height:1.05}
.start p{margin:12px 0;font-size:clamp(15px,1.8vw,19px);color:#3b4658;line-height:1.5}
.start input{font-family:Lexend;font-size:20px;padding:12px 14px;border:2px solid #c9d6ec;border-radius:12px;width:min(340px,100%);margin:6px 0 16px}
.stations{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.st{flex:1;min-width:140px;border-radius:12px;padding:8px 10px;background:#eef2f8;color:#6b7280;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.st b{font-family:Fredoka;font-size:20px;width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:#d5deec;color:#fff}
.st.on{background:var(--fblau);color:var(--dblau);outline:2px solid var(--blau)}.st.on b{background:var(--blau)}
.st.done{background:#E8F6EC;color:var(--gruen)}.st.done b{background:var(--gruen)}
.prog{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#4a5568;margin-bottom:6px;font-weight:600}
.bar{height:8px;background:#e6ecf6;border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:linear-gradient(90deg,var(--a),var(--b),var(--g));transition:width .3s}
.q{display:flex;gap:18px;align-items:flex-start}
.q>img{height:clamp(110px,19vh,170px)}
.lvl{display:inline-block;font-size:12px;font-weight:700;color:var(--dorange);background:var(--horange);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.qt{font-size:clamp(19px,2.5vw,29px);line-height:1.35;font-weight:600;color:var(--dblau)}
.ctx{font-size:15px;color:#4a5568;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;border:3px solid #c9d6ec;background:var(--fblau);border-radius:16px;padding:14px 16px;font-size:clamp(17px,2.2vw,25px);cursor:pointer;font-family:Lexend;text-align:left;color:#1d2433;min-height:68px}
.opt b{background:var(--dblau);color:#fff;border-radius:10px;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-size:19px}
.opt.big{justify-content:center;font-family:Fredoka;font-size:clamp(28px,4vw,44px);color:#fff;border:none}
.opt.big b{background:rgba(255,255,255,.25)}
.opt.ka{background:var(--a)}.opt.kb{background:var(--b)}.opt.kg{background:var(--g)}
.opt.ok{border-color:var(--gruen)!important;background:#E8F6EC!important;color:#1d2433}.opt.ok b{background:var(--gruen)}
.opt.no{border-color:var(--rot)!important;background:#FDECEC!important;color:#1d2433}.opt.no b{background:var(--rot)}
.opt[disabled]{cursor:default}
.gl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(22px,3vw,34px);margin-top:20px;font-family:Lexend}
.nuk{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.55em;line-height:1.05;margin-right:3px}
.nuk input{width:70px;font-family:Lexend;font-size:20px;text-align:center;border:2px solid #9fb3d6;border-radius:8px;padding:3px;margin:2px 0}
.gl select{font-family:Lexend;font-size:24px;border:2px solid #9fb3d6;border-radius:8px;padding:4px 6px}
.fb{display:none;margin-top:18px;border-radius:16px;padding:14px 16px 14px 128px;position:relative;font-size:clamp(15px,1.85vw,20px);line-height:1.5;min-height:110px}
.fb>img{position:absolute;left:8px;bottom:0;height:118px}
.fb.ok{background:#E8F6EC;border:2px solid var(--gruen)}
.fb.no{background:#FDECEC;border:2px solid var(--rot)}
.fb .h{font-family:Fredoka;font-weight:600;font-size:clamp(19px,2.3vw,26px)}
.fb.ok .h{color:var(--gruen)}.fb.no .h{color:var(--rot)}
.weiter{margin-top:10px;text-align:right}
.code{display:flex;gap:10px;justify-content:center;margin:14px 0}
.code span{width:62px;height:76px;border-radius:12px;background:var(--dblau);color:#fff;font-family:Fredoka;font-size:44px;display:flex;align-items:center;justify-content:center}
.code span.leer{background:#d5deec;color:#d5deec}
.mid{text-align:center}
.mid img{height:clamp(150px,26vh,250px)}
.mid h2{font-size:clamp(26px,3.8vw,42px);color:var(--blau);margin:6px 0}
.mid p{font-size:clamp(15px,1.8vw,19px);color:#3b4658;margin:6px 0 14px;line-height:1.5}
.urk{border:4px double var(--blau);border-radius:18px;padding:22px;background:linear-gradient(#fff,#f6f9ff)}
.urk .nm{font-family:Fredoka;font-size:clamp(28px,4vw,40px);color:var(--dblau)}
.score{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.score div{border-radius:14px;padding:10px 20px;color:#fff;font-weight:700;font-size:17px}
.score span{display:block;font-family:Fredoka;font-size:36px}
.lst{text-align:left;max-width:640px;margin:10px auto 0;font-size:15px;line-height:1.6}
.hint{font-size:13px;color:#6b7280;margin-top:10px}
.home{background:transparent;border:2px solid #fff;color:#fff;border-radius:10px;padding:6px 12px;font-family:Lexend;cursor:pointer;font-size:14px}
@media (max-width:720px){.opts,.opts.three{grid-template-columns:1fr}.start{flex-direction:column;text-align:center}.q>img{display:none}.fb{padding-left:16px}.fb>img{display:none}}
</style>
</head>

  {t:'mc',l:1,q:'Welche Ladung hat ein α-Teilchen?',o:['zweifach positiv','einfach negativ','neutral','einfach positiv'],a:0,e:'2 Protonen sind positiv, die 2 Neutronen sind neutral. Zusammen also zweifach positiv.'},
  {t:'mc',l:1,q:'Welche Strahlung ist <b>keine</b> Teilchenstrahlung?',o:['γ-Strahlung','α-Strahlung','β-Strahlung','alle drei sind Teilchen'],a:0,e:'α und β sind Teilchenstrahlung. γ ist Energiestrahlung.'},
 ]},
 {name:'Schutzschild',pose:'strahlung',intro:'Die Proben strahlen. Baue den richtigen Schutz auf. Denk dran: Nicht jede Strahlung lässt sich gleich gut abschirmen.',qs:[
  {t:'abg',l:0,q:'Diese Strahlung wird schon von <b>einem Blatt Papier</b> gestoppt.',a:0,e:'α-Teilchen sind groß und stoßen sehr oft an. Schon Papier oder die Haut hält sie auf.'},
  {t:'abg',l:1,q:'Diese Strahlung kommt durch Papier, wird aber von <b>4–5 mm Aluminium</b> gestoppt.',a:1,e:'β-Teilchen kommen weiter als α, aber ein Aluminiumblech hält sie auf.'},
  {t:'mc',l:1,q:'Womit schirmt man γ-Strahlung am besten ab?',o:['dicke Bleiwand oder Beton','ein Blatt Papier','dünnes Aluminiumblech','eine Plastikfolie'],a:0,e:'γ-Strahlung dringt sehr weit durch. Man braucht dicke Bleiwände oder Beton – und auch dann wird sie nur abgeschwächt.'},
  {t:'mc',l:1,q:'Wie weit kommt α-Strahlung ungefähr in Luft?',o:['wenige Zentimeter','mehrere Meter','einige Kilometer','gar nicht'],a:0,e:'α-Strahlung hat in Luft nur eine Reichweite von wenigen Zentimetern.'},
  {t:'mc',l:2,q:'Ordne nach dem <b>Ionisierungsvermögen</b> (stark → schwach).',o:['α → β → γ','γ → β → α','β → α → γ','alle gleich stark'],a:0,e:'α ionisiert am stärksten, γ am schwächsten. Je stärker die Ionisierung, desto kleiner die Reichweite.'},
  {t:'mc',l:2,q:'Ein α-Strahler liegt <b>außerhalb</b> des Körpers. Warum ist er dann recht ungefährlich?',o:['Die Haut stoppt die α-Teilchen.','α-Strahlung ist nicht radioaktiv.','α-Teilchen sind ungeladen.','α-Strahlung geht durch den Körper durch.'],a:0,e:'Die oberste Hautschicht hält α-Teilchen auf. Gefährlich wird es, wenn man α-Strahler einatmet oder verschluckt.'},
 ]},
 {name:'Kern-Werkstatt',pose:'atom',intro:'Im Kern passiert etwas, wenn er strahlt. Finde heraus, was sich verändert.',qs:[
  {t:'abg',l:1,q:'Bei diesem Zerfall wird die <b>Massenzahl um 4</b> und die <b>Ordnungszahl um 2</b> kleiner.',a:0,e:'Ein α-Teilchen nimmt 2 Protonen und 2 Neutronen mit: Massenzahl −4, Ordnungszahl −2.'},
  {t:'abg',l:1,q:'Bei diesem Zerfall bleibt die Massenzahl gleich, die <b>Ordnungszahl wird um 1 größer</b>.',a:1,e:'Beim β-Zerfall wird ein Neutron zu einem Proton und einem Elektron. Ein Proton mehr: Ordnungszahl +1.'},
  {t:'abg',l:0,q:'Bei dieser Strahlung entsteht <b>kein neues Element</b>. Der Kern gibt nur Energie ab.',a:2,e:'γ-Strahlung ändert weder Protonen- noch Neutronenzahl. Der Kern wird nur energieärmer.'},
  {t:'mc',l:1,q:'Was passiert im Kern beim β-Zerfall?',o:['Ein Neutron wird zu einem Proton und einem Elektron.','Ein Proton wird zu einem Neutron.','Zwei Protonen verlassen den Kern.','Ein Elektron aus der Hülle fällt in den Kern.'],a:0,e:'n → p + e. Das Elektron fliegt als β-Teilchen davon, das Proton bleibt im Kern.'},
  (()=>{const z=rnd(ALPHA);return {t:'mc',l:2,q:`${z[6]}-${z[1]} (Ordnungszahl ${z[2]}) sendet ein α-Teilchen aus. Wo steht das neue Element im Periodensystem?`,o:['2 Felder weiter links','1 Feld weiter rechts','2 Felder weiter rechts','an derselben Stelle'],a:0,e:`Ordnungszahl ${z[2]} − 2 = ${z[5]}. Das neue Element ist ${z[3]} und steht 2 Felder weiter links.`};})(),
  (()=>{const z=rnd(BETA);return {t:'mc',l:2,q:`${z[6]}-${z[1]} (Ordnungszahl ${z[2]}) ist ein β-Strahler. Welche Ordnungszahl hat der neue Kern?`,o:[String(z[5]),String(z[2]-1),String(z[2]),String(z[2]-2)],a:0,e:`Beim β-Zerfall wird die Ordnungszahl um 1 größer: ${z[2]} + 1 = ${z[5]}. Das neue Element ist ${z[3]}.`};})(),
 ]},
 {name:'Gleichungs-Tresor',pose:'taschenrechner',intro:'Der Tresor öffnet sich nur mit richtigen Zerfallsgleichungen. Trage die fehlenden Zahlen ein. Tipp: Oben und unten muss die Summe links und rechts gleich sein.',qs:[
  {t:'eq',l:1,k:'a',z:a2[0]},
  {t:'eq',l:1,k:'b',z:b1},
  {t:'eq',l:2,k:'a',z:a2[1]},
  {t:'eq',l:2,k:'g',z:['Ba',137,56,'Ba',137,56,'Barium']},
 ]},
 ];
}

// ---------- Spielstand ----------
let S=null;
function startScreen(){
 S=null; homeBtn.style.display='none';
 app.innerHTML=`<div class="start"><img src="${P.abg}" alt=""><div>
 <h1>Mission Strahlenlabor</h1>
 <p>Im Schullabor ist der Strahlenschutz-Tresor verschlossen. Löse an <b>4 Stationen</b> alle Aufgaben zu ${A}-, ${B}- und ${G}-Strahlung. Jede Station verrät dir eine Ziffer des Codes.</p>
 <p style="font-size:15px">Falsche Antworten kommen am Ende der Station noch einmal dran. Du musst also <b>alle Fragen</b> richtig lösen. Die Sterne zeigen, wie knifflig eine Frage ist.</p>
 <input id="nm" placeholder="Dein Vorname" maxlength="24" autocomplete="off"><br>
 <button class="btn or" id="go">Mission starten ⏎</button></div></div>`;
 const nm=document.getElementById('nm'); nm.focus();
 const go=()=>begin(nm.value.trim()||'Laborprofi');
 document.getElementById('go').onclick=go; nm.onkeydown=e=>{if(e.key==='Enter')go();};
}
function begin(name){
 homeBtn.style.display='';
 const st=stations();
 S={name,st,si:0,queue:null,cur:null,answered:false,erst:0,total:0,versuche:0,code:[],t0:Date.now(),fehler:[]};
 st.forEach(s=>S.total+=s.qs.length);
 stationIntro();
}
function header(){
 const done=S.st.reduce((n,s,i)=>n+(i<S.si?s.qs.length:0),0)+(S.queue?S.queue.doneCount:0);
 return `<div class="stations">${S.st.map((s,i)=>`<div class="st ${i<S.si?'done':i===S.si?'on':''}"><b>${i<S.si?'✓':i+1}</b>${s.name}</div>`).join('')}</div>
 <div class="prog"><span>${S.name} · Station ${S.si+1}: ${S.st[S.si].name}</span><span>${done} / ${S.total} gelöst</span></div>
 <div class="bar"><div style="width:${100*done/S.total}%"></div></div>`;
}
function stationIntro(){
 const s=S.st[S.si];
 S.queue={items:shuffle(s.qs.map((q,i)=>({...q,first:true,id:i}))),doneCount:0};
 app.innerHTML=`${header()}<div class="mid"><img src="${P[s.pose]}" alt=""><h2>Station ${S.si+1}: ${s.name}</h2><p>${s.intro}</p>
 <button class="btn" id="wb">Los geht's ⏎</button></div>`;
 document.getElementById('wb').onclick=nextQ; S.wait=nextQ;
}
function nextQ(){
 S.wait=null;
 if(!S.queue.items.length){ return stationDone(); }
 S.cur=S.queue.items.shift(); S.answered=false; render();
}
function render(){
 const q=S.cur; let body='';
 const lvl=`<span class="lvl">${LV[q.l]}</span>${q.first?'':' <span class="lvl" style="color:var(--rot);background:#FDECEC">2. Versuch</span>'}`;
 if(q.t==='abg'){
  body=`<div class="q"><img src="${P.nachdenken}" alt=""><div>${lvl}<div class="ctx">Welche Strahlung ist gemeint?</div><div class="qt">${q.q}</div></div></div>
  <div class="opts three"><button class="opt big ka" data-i="0"><b>1</b>α</button><button class="opt big kb" data-i="1"><b>2</b>β</button><button class="opt big kg" data-i="2"><b>3</b>γ</button></div>`;
 } else if(q.t==='mc'){
  if(!q.order){q.order=shuffle([0,1,2,3]);}
  body=`<div class="q"><img src="${P.nachdenken}" alt=""><div>${lvl}<div class="qt">${q.q}</div></div></div>
  <div class="opts">${q.order.map((k,i)=>`<button class="opt" data-i="${k}"><b>${i+1}</b><span>${q.o[k]}</span></button>`).join('')}</div>`;
 } else {
  const z=q.z, art=q.k==='a'?A+'-Zerfall':q.k==='b'?B+'-Zerfall':G+'-Strahlung';
  const teil=q.k==='a'?`<span class="nuk"><input id="pm" inputmode="numeric"><input id="pz" inputmode="numeric"></span>He`
            :q.k==='b'?`<span class="nuk"><input id="pm" inputmode="numeric"><input id="pz" inputmode="numeric"></span>e`
            :`<select id="ps"><option value="">?</option><option>α</option><option>β</option><option>γ</option></select>`;
  body=`<div class="q"><img src="${P.taschenrechner}" alt=""><div>${lvl}<div class="ctx">${art} von ${z[6]}-${z[1]}</div><div class="qt">Ergänze die fehlenden Zahlen${q.k==='g'?' und das Zeichen':''}.</div></div></div>
  <div class="gl"><span class="nuk"><span>${z[1]}</span><span>${z[2]}</span></span>${z[0]}${q.k==='g'?'*':''} → <span class="nuk"><input id="km" inputmode="numeric"><input id="kz" inputmode="numeric"></span>${z[3]} + ${teil}</div>
  <div style="margin-top:16px"><button class="btn" id="chk">Prüfen ⏎</button></div>`;
 }
 app.innerHTML=header()+body+'<div class="fb" id="fb"></div>';
 if(q.t==='eq'){ document.getElementById('chk').onclick=checkEq; const f=app.querySelector('input,select'); if(f)f.focus(); }
 else app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
const PRAISE=['lob','klatschen','jubel'], OOPS=['ups','facepalm','achtung'];
function feedback(ok,richtig,expl){
 const fb=document.getElementById('fb'); fb.className='fb '+(ok?'ok':'no'); fb.style.display='block'; fb.style.paddingLeft='';
 const q=S.cur;
 fb.innerHTML=`<img src="${P[ok?rnd(PRAISE):rnd(OOPS)]}" alt=""><div class="h">${ok?rnd(['Richtig!','Stark!','Genau so!','Super!']):'Noch nicht ganz.'}</div>
 ${ok?'':`Richtig ist: <b>${richtig}</b><br>`}${expl}${ok?'':'<br><i>Diese Frage kommt am Ende der Station noch einmal.</i>'}
 <div class="weiter"><button class="btn" id="wb">Weiter ⏎</button></div>`;
 document.getElementById('wb').onclick=nextQ; S.wait=nextQ;
 if(ok){ S.queue.doneCount++; if(q.first) S.erst++; }
 else { if(q.first) S.fehler.push(q); S.queue.items.push({...q,first:false}); }
 S.versuche++;
 const bar=app.querySelector('.bar div'); if(bar) bar.style.width=(100*(S.st.reduce((n,s,i)=>n+(i<S.si?s.qs.length:0),0)+S.queue.doneCount)/S.total)+'%';
}
function answer(i){
 if(S.answered)return; S.answered=true; const q=S.cur, ok=i===q.a;
 app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const k=+b.dataset.i;if(k===q.a)b.classList.add('ok');else if(k===i)b.classList.add('no');});
 const richtig=q.t==='abg'?['α-Strahlung','β-Strahlung','γ-Strahlung'][q.a]:q.o[q.a];
 feedback(ok,richtig,q.e);
}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function checkEq(){
 if(S.answered)return; const q=S.cur,z=q.z;
 let ok,richtig,expl;
 if(q.k==='a'){ ok=val('km')==z[4]&&val('kz')==z[5]&&val('pm')=='4'&&val('pz')=='2';
  richtig=`${z[0]}-${z[1]} → ${z[3]}-${z[4]} (${z[5]}) + He-4 (2)`;
  expl=`Oben: ${z[1]} = ${z[4]} + 4. Unten: ${z[2]} = ${z[5]} + 2.`; }
 else if(q.k==='b'){ ok=val('km')==z[4]&&val('kz')==z[5]&&val('pm')=='0'&&(val('pz')=='-1'||val('pz')=='−1');
  richtig=`${z[0]}-${z[1]} → ${z[3]}-${z[4]} (${z[5]}) + Elektron (0 und −1)`;
  expl=`Das Elektron hat Massenzahl 0 und Ladung −1. Oben: ${z[1]} = ${z[4]} + 0. Unten: ${z[2]} = ${z[5]} + (−1).`; }
 else { ok=val('km')==z[4]&&val('kz')==z[5]&&val('ps')==='γ';
  richtig=`Ba-137* → Ba-137 (56) + γ`;
  expl='Bei γ-Strahlung bleiben Massenzahl und Ordnungszahl gleich. Der Kern gibt nur Energie ab.'; }
 if(!ok && [...app.querySelectorAll('input,select')].some(e=>!e.value.trim())){ alertBox('Bitte fülle alle Felder aus.'); return; }
 S.answered=true; app.querySelectorAll('input,select').forEach(e=>e.disabled=true); document.getElementById('chk').disabled=true;
 feedback(ok,richtig,expl);
}
function alertBox(t){const fb=document.getElementById('fb');fb.className='fb no';fb.style.display='block';fb.style.paddingLeft='16px';fb.innerHTML=t;}
function stationDone(){
 S.code.push((S.si*3+7+S.st[S.si].qs.length)%10);
 S.si++;
 const fertig=S.si>=S.st.length;
 const codeHtml=`<div class="code">${[0,1,2,3].map(i=>i<S.code.length?`<span>${S.code[i]}</span>`:'<span class="leer">?</span>').join('')}</div>`;
 if(fertig) return finale(codeHtml);
 app.innerHTML=`${header()}<div class="mid"><img src="${P.klatschen}" alt=""><h2>Station geschafft!</h2><p>Du hast eine Ziffer für den Tresor-Code gefunden:</p>${codeHtml}
 <button class="btn" id="wb">Zur nächsten Station ⏎</button></div>`;
 document.getElementById('wb').onclick=stationIntro; S.wait=stationIntro;
}
function finale(codeHtml){
 const min=Math.round((Date.now()-S.t0)/60000);
 const quote=Math.round(100*S.erst/S.total);
 const sterne=quote>=87?'★★★':quote>=59?'★★☆':'★☆☆';
 S.done=true; S.wait=null;
 app.innerHTML=`<div class="mid"><img src="${P.jubel}" alt=""><h2>Tresor geöffnet!</h2>${codeHtml}
 <div class="urk"><div style="font-size:15px;color:#4a5568">Urkunde · Mission Strahlenlabor · Physik 9F</div>
 <div class="nm">${S.name.replace(/</g,'')}</div>
 <div>hat alle ${S.total} Aufgaben zu α-, β- und γ-Strahlung gelöst.</div>
 <div class="score"><div style="background:var(--gruen)">beim 1. Versuch<span>${S.erst} / ${S.total}</span></div>
 <div style="background:var(--blau)">Bewertung<span>${sterne}</span></div><div style="background:var(--orange)">Zeit<span>${min} min</span></div></div>
 ${S.fehler.length?`<div class="lst"><b>Das solltest du noch einmal wiederholen:</b><ul style="margin-left:20px">${S.fehler.map(q=>`<li>${q.t==='eq'?'Zerfallsgleichung '+q.z[6]+'-'+q.z[1]:q.q.replace(/<[^>]+>/g,'')}</li>`).join('')}</ul></div>`:'<div class="lst" style="text-align:center"><b>Alles beim ersten Versuch richtig – stark!</b></div>'}
 </div><p class="hint">Mach einen Screenshot von deiner Urkunde und zeig ihn Herrn Özdemir.</p>
 <button class="btn or" id="again">Nochmal spielen (neue Aufgaben) ⏎</button></div>`;
 document.getElementById('again').onclick=()=>begin(S.name);
}
document.addEventListener('keydown',e=>{
 if(!S) return;
 if(S.done){ if(e.key==='Enter') begin(S.name); return; }
 if(e.key==='Enter'){ if(S.wait){ e.preventDefault(); S.wait(); return; } if(S.cur&&S.cur.t==='eq'&&!S.answered){ e.preventDefault(); checkEq(); } return; }
 if(S.cur && !S.answered && S.cur.t!=='eq' && !S.wait){
  const n=+e.key; if(S.cur.t==='abg'&&n>=1&&n<=3) answer(n-1);
  if(S.cur.t==='mc'&&n>=1&&n<=4) answer(S.cur.order[n-1]);
 }
});
startScreen();
</script>
</body>

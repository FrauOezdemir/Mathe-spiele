<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plus & Minus Profi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#fff8ec; --ink:#2b2340; --muted:#6b6280; --line:#eadfcb;
  --summand:#2563eb; --summe:#15803d; --minuend:#ea580c; --subtrahend:#9333ea; --differenz:#db2777;
  --ok:#16a34a; --bad:#dc2626; --accent:#f59e0b; --accent2:#6366f1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 5% 0%,#ffe2a8 0,transparent 38%),radial-gradient(circle at 100% 25%,#dfe4ff 0,transparent 35%),radial-gradient(circle at 0% 100%,#ffd9ea 0,transparent 30%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.screen{display:none}.screen.on{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Home */
.hero{text-align:center;padding:10px 0 4px}
.logo{display:inline-flex;gap:6px;margin-bottom:4px}
.logo span{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:2.2rem;font-weight:700;color:#fff;transform:rotate(-6deg);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.logo span:nth-child(1){background:var(--summand)}
.logo span:nth-child(2){background:var(--differenz);transform:rotate(6deg)}
.hero h1{margin:6px 0 2px;font-size:2rem}
.hero p{margin:0;color:var(--muted);font-weight:600}
.starsTotal{display:inline-block;margin-top:10px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:800}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 14px;margin:10px 0;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode .ic{font-size:1.8rem;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.mode b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:1.2rem;font-weight:600;display:block}
.mode span.d{color:var(--muted);font-size:.95rem}
.mode small.rec{display:block;color:var(--accent);font-weight:800;font-size:.8rem}
.box{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;margin-top:16px}
.box h3{margin:0 0 8px;font-size:1.1rem}
.setrow{margin:8px 0}
.setlab{font-weight:800;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:#fffdf8;border-radius:12px;padding:9px 4px;font-weight:700;font-size:.95rem}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* buttons */
.btn{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;border:none;border-radius:16px;padding:14px 18px;font-size:1.15rem;background:var(--accent2);color:#fff;box-shadow:0 4px 0 #4338ca;transition:transform .08s;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4338ca}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:.95rem}
.hidden{display:none!important}

/* game top */
.gtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.gtop .meta{flex:1;min-width:0}
.bar{height:12px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f97316);border-radius:999px;transition:width .35s}
.gline{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;margin-top:4px;color:var(--muted)}
.gline .sc{color:var(--ink)}
.card{background:#fff;border-radius:24px;padding:18px 16px;border:2px solid var(--line);box-shadow:0 6px 0 var(--line)}
.prompt{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:1.35rem;font-weight:500;text-align:center;line-height:1.35}
.prompt b{font-weight:700}

/* terms */
.t{font-weight:800;padding:0 5px;border-radius:7px;white-space:nowrap}
.t-summand{color:var(--summand);background:#dbeafe}
.t-summe{color:var(--summe);background:#dcfce7}
.t-minuend{color:var(--minuend);background:#ffedd5}
.t-subtrahend{color:var(--subtrahend);background:#f3e8ff}
.t-differenz{color:var(--differenz);background:#fce7f3}

/* equation */
.eq{display:flex;justify-content:center;align-items:flex-start;gap:4px;margin:16px 0 6px}
.eq .part{display:flex;flex-direction:column;align-items:center;min-width:56px}
.eq .num{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:clamp(1.7rem,8vw,2.2rem);font-weight:600;padding:2px 8px;border-radius:12px;border:3px solid transparent;line-height:1.2}
.eq .part.mark .num{background:#fff3c4;border-color:var(--accent);animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.eq .sym{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:clamp(1.6rem,7vw,2rem);padding-top:4px;color:var(--muted)}
.eq .lab{font-size:.78rem;font-weight:800;min-height:1.2em;margin-top:3px;padding:0 4px;border-radius:6px}
.eq .lab.q{color:var(--accent);font-size:1rem}
.eq .part.c-summand .num{color:var(--summand)}
.eq .part.c-summe .num{color:var(--summe)}
.eq .part.c-minuend .num{color:var(--minuend)}
.eq .part.c-subtrahend .num{color:var(--subtrahend)}
.eq .part.c-differenz .num{color:var(--differenz)}
.formula{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin:16px 0 4px;font-size:1.2rem}
.formula .op{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:1.5rem;color:var(--muted)}
.formula .gap{display:inline-block;min-width:70px;text-align:center;border:3px dashed var(--accent);border-radius:10px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;color:var(--accent);background:#fff8e1;animation:pulse 1.3s infinite}

/* column (Kästchen) */
.colwrap{display:flex;justify-content:center;margin:14px 0 6px}
.col{display:grid;gap:1px;background:#d6e2f2;border:1px solid #d6e2f2;--cell:clamp(34px,10.5vw,46px)}
.cell{width:var(--cell);height:var(--cell);display:grid;place-items:center;background:#fff;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:calc(var(--cell)*.62);font-weight:500;line-height:1}
.cell.carry{height:calc(var(--cell)*.55);font-size:calc(var(--cell)*.42);color:var(--bad);font-weight:700;background:#fffafa}
.cell.res{box-shadow:inset 0 3px 0 var(--ink)}
.cell.typed{color:var(--accent2);font-weight:600}
.cell.cur{background:#eef2ff}
.cell.c-summand{color:var(--summand)}.cell.c-summe{color:var(--summe)}.cell.c-minuend{color:var(--minuend)}.cell.c-subtrahend{color:var(--subtrahend)}.cell.c-differenz{color:var(--differenz)}
.ansbox{margin:16px auto 4px;max-width:220px;text-align:center;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:2.2rem;font-weight:600;color:var(--accent2);border:3px solid #c7d2fe;border-radius:16px;padding:6px;min-height:64px;background:#f8f9ff}
.ansbox .ph{color:#b9bfd6;font-size:1.2rem;font-weight:500}

/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts.one{grid-template-columns:1fr}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 10px;font-weight:800;font-size:1.12rem;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:#dcfce7;border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{background:#fee2e2;border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pad button{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:1.6rem;font-weight:600;padding:10px 0;border-radius:14px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pad .ok{background:var(--ok);color:#fff;border-color:#15803d;box-shadow:0 3px 0 #15803d}
.pad .del{background:#fff7ed}
.pad.off{opacity:.35;pointer-events:none}

/* feedback */
.fb{margin-top:14px;border-radius:16px;font-weight:600;line-height:1.45}
.fb:empty{display:none}
.fb.ok{background:#dcfce7;padding:12px 14px;border:2px solid #86efac}
.fb.bad{background:#fff1f2;padding:12px 14px;border:2px solid #fecdd3}
.fb.hint{background:#fef3c7;padding:12px 14px;border:2px solid #fcd34d}
.fb .head{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:1.2rem;font-weight:600;display:block;margin-bottom:4px}
.fb .eq{margin:8px 0 0}
.steps{margin:8px 0 0;padding-left:20px;font-weight:600;font-size:.95rem}
.steps li{margin:4px 0}
.next{margin-top:14px}
.bonus{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:0 8px;font-size:.85rem;margin-left:4px}

/* learn */
.lcard{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0}
.lcard h2{margin:0 0 4px;font-size:1.3rem}
.lcard p{margin:6px 0;line-height:1.45}
.merk{background:#fff8e1;border-left:5px solid var(--accent);border-radius:10px;padding:8px 12px;margin:10px 0;font-weight:700}
.tip{color:var(--muted);font-size:.95rem}
.twocol{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* end */
.bigstars{font-size:3rem;text-align:center;letter-spacing:6px;margin:6px 0}
.bigstars .off{filter:grayscale(1);opacity:.25}
.endmsg{text-align:center;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:1.3rem;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#fffdf7;border:2px solid var(--line);border-radius:14px;text-align:center;padding:8px 4px}
.stat b{display:block;font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:1.5rem}
.stat span{font-size:.78rem;font-weight:700;color:var(--muted)}
.mist{list-style:none;padding:0;margin:8px 0}
.mist li{background:#fff1f2;border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:600}
.mist li b{color:var(--ok)}
.newrec{text-align:center;color:var(--accent);font-weight:800}
.row{display:flex;gap:10px;margin-top:14px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-40px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(380deg)}}
.iconbtn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.topbar{display:flex;justify-content:flex-end}

/* --- Ergänzungen Checkliste --- */
.sectitle{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.15rem;margin:18px 2px 4px;display:flex;justify-content:space-between;align-items:baseline}
.sectitle small{font-family:Nunito,system-ui,sans-serif;font-size:.8rem;color:var(--muted);font-weight:700}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin:8px 0;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.topic:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.topic .nr{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:1.05rem}
.topic .tx{flex:1;min-width:0}
.topic b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.08rem;display:block}
.topic span.d{color:var(--muted);font-size:.88rem;display:block;line-height:1.25}
.state{flex:none;font-size:.75rem;font-weight:800;border-radius:999px;padding:3px 8px;white-space:nowrap;background:#f3f0ea;color:var(--muted)}
.state.s3{background:#dcfce7;color:#15803d}.state.s2{background:#fef3c7;color:#a16207}.state.s1{background:#fee2e2;color:#b91c1c}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;border-radius:20px;padding:14px 16px;margin:12px 0;color:#fff;background:linear-gradient(135deg,#6366f1,#db2777);box-shadow:0 5px 0 #4338ca}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #4338ca}
.bigbtn .ic{font-size:2rem}
.bigbtn b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.25rem;display:block}
.bigbtn span{font-size:.9rem;opacity:.92}
.bigbtn small{display:block;font-weight:800;font-size:.8rem;opacity:.95}
.expr{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:clamp(1.6rem,7.5vw,2.2rem);text-align:center;margin:16px 0 4px;white-space:nowrap}
.expr.sm{font-size:clamp(1.1rem,5.2vw,1.5rem);white-space:normal}
.prompt.long{font-family:Nunito,system-ui,sans-serif;font-size:1.12rem;font-weight:700;text-align:left;line-height:1.5;background:#fffaf0;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.sub{margin-top:14px;font-weight:800;text-align:center;font-size:1.05rem}
.ansrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.ansrow .ansbox{margin:8px 0 4px;flex:0 1 220px}
.unit{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:1.3rem;font-weight:600;color:var(--muted)}
.prefb{margin-top:10px;border-radius:14px;padding:10px 12px;font-weight:600;line-height:1.4}
.prefb:empty{display:none}
.prefb.ok{background:#dcfce7}.prefb.bad{background:#fff1f2}
.check{text-align:center;margin:8px 0;font-weight:800}
.lnav{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.lnav button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-weight:800;font-size:.85rem}
table.words{width:100%;border-collapse:collapse;margin:8px 0;font-size:.95rem}
table.words td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.words td:first-child{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:1.4rem;text-align:center;width:44px}
.hl{background:#fff3c4;border-radius:6px;padding:0 4px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <section id="home" class="screen on">
    <div class="topbar"><button class="iconbtn" id="soundBtn" aria-label="Ton an/aus">🔊</button></div>
    <div class="hero">
      <div class="logo"><span>+</span><span>−</span></div>
      <h1>Plus & Minus Profi</h1>
      <p>Training für die Klassenarbeit Nr. 2</p>
      <div class="starsTotal">⭐ <span id="starsTotal">0</span> Sterne gesammelt</div>
    </div>

    <button class="mode" data-go="learn"><div class="ic" style="background:#fef3c7">📖</div><div><b>Merkzettel</b><span class="d">Alles Wichtige zu den 7 Punkten der Checkliste</span></div></button>

    <div class="sectitle">📋 Checkliste – Ich kann … <small>tippen zum Üben</small></div>
    <div id="topics"></div>

    <button class="bigbtn" data-play="test"><div class="ic">🏆</div><div><b>Probe-Klassenarbeit</b><span>14 Aufgaben aus allen 7 Bereichen</span><small id="rec-test"></small></div></button>

    <div class="box">
      <h3>⚙️ Einstellungen für Nr. 4 (schriftlich)</h3>
      <div id="settings"></div>
    </div>
  </section>

  <!-- LEARN -->
  <section id="learn" class="screen">
    <div class="gtop"><button class="iconbtn" data-go="home">← Menü</button></div>
    <div id="learnBody"></div>
    <button class="btn" data-go="home">Zurück zur Checkliste 📋</button>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="gtop">
      <button class="iconbtn" data-go="home">←</button>
      <div class="meta">
        <div class="bar"><i id="prog"></i></div>
        <div class="gline"><span id="qnum"></span><span><span id="streak"></span> <span class="sc" id="score"></span></span></div>
      </div>
    </div>
    <div class="card" id="qcard"></div>
  </section>

  <!-- END -->
  <section id="end" class="screen">
    <div class="card" id="endcard"></div>
  </section>
</div>

<script>
/* ---------- Hilfsfunktionen ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const rep=(n,f)=>Array.from({length:n},()=>f());
const nDigit=n=>rnd(10**(n-1),10**n-1);
const digitsOf=n=>String(n).split('').reverse().map(Number);
const sym=op=>(op==='+'?'+':'−');
const res=(a,b,op)=>(op==='+'?a+b:a-b);
const opf=(x,o,y)=>(o==='+'?x+y:x-y);
const eqText=(a,b,op)=>`${a} ${sym(op)} ${b} = ${res(a,b,op)}`;
const strip=h=>h.replace(/<[^>]+>/g,'');

const TERM_COL={Summand:'summand',Summanden:'summand',Summe:'summe',Minuend:'minuend',Subtrahend:'subtrahend',Differenz:'differenz'};
const ART={Summand:'der',Summe:'die',Minuend:'der',Subtrahend:'der',Differenz:'die'};
const T=name=>`<span class="t t-${TERM_COL[name]||''}">${name}</span>`;

/* Rechenausdruck auswerten (Klammern zuerst, dann von links nach rechts) */
function evalExpr(expr){
  const steps=[];let e=expr,m;
  while((m=e.match(/\((\d+) ([+−]) (\d+)\)/))){const v=opf(+m[1],m[2],+m[3]);steps.push(`Klammer zuerst: ${m[1]} ${m[2]} ${m[3]} = <b>${v}</b>`);e=e.replace(m[0],String(v));}
  let t=e.split(' ');
  while(t.length>1){const v=opf(+t[0],t[1],+t[2]);steps.push(`${t[0]} ${t[1]} ${t[2]} = <b>${v}</b>`);t=[String(v),...t.slice(3)];}
  return {value:+t[0],steps};
}
const stepsHTML=st=>`<ol class="steps">${st.map(x=>`<li>${x}</li>`).join('')}</ol>`;

/* ---------- Speicher ---------- */
const KEY='plusMinusProfi.v1';
let store={settings:{op:'beides',carry:'beides',digits:3},high:{},stars:0,sound:true,topics:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){store=Object.assign(store,s);store.settings=Object.assign({op:'beides',carry:'beides',digits:3},s.settings||{});store.topics=s.topics||{};store.high=s.high||{};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

/* ---------- Ton ---------- */
let ac=null;
function beep(kind){
  if(!store.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const notes=kind==='win'?[523,659,784,1047]:kind==='ok'?[660,880]:kind==='hint'?[440,392]:[247,196];
    notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.11;
      o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.3);});
  }catch(e){}
}

/* ---------- Schriftlich: Zahlen erzeugen ---------- */
function addCarry(a,b){const A=digitsOf(a),B=digitsOf(b);for(let i=0;i<Math.max(A.length,B.length);i++){if((A[i]||0)+(B[i]||0)>=10)return true;}return false;}
function subBorrow(a,b){const A=digitsOf(a),B=digitsOf(b);for(let i=0;i<B.length;i++){if(A[i]<B[i])return true;}return false;}
function genAdd(n,carry){
  for(let t=0;t<3000;t++){
    const lb=(n>1&&Math.random()<.3)?n-1:n; let a,b;
    if(!carry){
      const A=[],B=[];let okk=true;
      for(let i=0;i<n;i++){
        const lead=i===n-1, da=rnd(lead?1:0,lead?8:9);A.push(da);
        if(i<lb){const min=(i===lb-1)?1:0,max=9-da;if(max<min){okk=false;break;}B.push(rnd(min,max));}
      }
      if(!okk)continue;
      a=+A.reverse().join('');b=+B.reverse().join('');
    }else{a=nDigit(n);b=nDigit(lb);}
    if(b<2||addCarry(a,b)!==carry)continue;
    return [a,b];
  }
  return carry?[47,38]:[42,35];
}
function genSub(n,borrow){
  for(let t=0;t<3000;t++){
    const lb=(n>1&&Math.random()<.3)?n-1:n; let a,b;
    if(!borrow){
      const A=[],B=[];let okk=true;
      for(let i=0;i<n;i++){
        const lead=i===n-1, da=rnd(lead?2:0,9);A.push(da);
        if(i<lb){const bl=i===lb-1,min=bl?1:0,max=(bl&&lb===n)?da-1:da;if(max<min){okk=false;break;}B.push(rnd(min,max));}
      }
      if(!okk)continue;
      a=+A.reverse().join('');b=+B.reverse().join('');
    }else{a=nDigit(n);b=nDigit(lb);if(b>=a)continue;}
    if(b<2||a-b<2||subBorrow(a,b)!==borrow)continue;
    return [a,b];
  }

}
const PLACES=['Einer','Zehner','Hunderter','Tausender','Zehntausender'];
function solve(a,b,op){
  const A=digitsOf(a),B=digitsOf(b),steps=[],carries=[];let c=0;
  if(op==='+'){
    const L=Math.max(A.length,B.length);
    for(let i=0;i<L;i++){
      const da=A[i]||0,hasA=i<A.length,hasB=i<B.length,db=B[i]||0,s=da+db+c,P=`<b>${PLACES[i]}:</b> `;
      let txt;
      if(hasA&&!hasB&&!c){txt=P+`nur die ${da} → schreibe ${da} ab`;}
      else{
        const parts=[];if(hasA)parts.push(da);if(hasB)parts.push(db);
        txt=P+parts.join(' + ')+(c?' + 1 (Übertrag)':'')+` = ${s}`;
        txt+=s>=10?` → schreibe ${s%10}, merke <b>1 Übertrag</b>`:` → schreibe ${s}`;
      }
      if(s>=10){carries[i+1]=1;c=1;}else c=0;
      steps.push(txt);
    }
    if(c)steps.push(`<b>${PLACES[L]}:</b> nur der Übertrag 1 → schreibe 1`);
  }else{
    for(let i=0;i<A.length;i++){
      const da=A[i],hasB=i<B.length,db=B[i]||0,sub=db+c,P=`<b>${PLACES[i]}:</b> `;let txt;
      if(!hasB&&!c){
        txt=(i===A.length-1&&da===0)?P+'nichts mehr übrig':P+`nur die ${da} → schreibe ${da} ab`;
      }else{
        const pre=c?(hasB?`erst den Übertrag dazu: ${db} + 1 = ${sub}. Dann `:`nur der Übertrag 1. `):'';
        if(da>=sub){
          const r=da-sub;txt=P+pre+`${da} − ${sub} = ${r}`;
          txt+=(i===A.length-1&&r===0&&A.length>1)?' → eine 0 ganz vorne schreibt man nicht':` → schreibe ${r}`;c=0;
        }else{
          const r=da+10-sub;txt=P+pre+`${da} − ${sub} geht nicht → ${da+10} − ${sub} = ${r} → schreibe ${r}, merke <b>1 Übertrag</b>`;
          carries[i+1]=1;c=1;
        }
      }
      steps.push(txt);
    }
  }
  return {steps,carries,result:res(a,b,op)};
}

function colWidth(a,b,op){return Math.max(String(a).length,String(b).length)+(op==='+'?2:1);}
function columnHTML(a,b,op,o={}){

  let carryRow='';for(let i=0;i<n;i++){const ci=n-1-i;carryRow+=`<div class="cell carry">${o.carries&&o.carries[ci]?'1':''}</div>`;}
  let resRow='';const pad=n-R.length;

}

/* ================= 5. KLAMMERN ================= */
function klammerExpr(forms){
  for(;;){
    const f=pick(forms),a=rnd(8,20)*10,b=rnd(2,12)*5,c=rnd(2,12)*5,d=rnd(2,9)*5;let e,alt=null;
    if(f===0)e=`${a} − (${b} + ${c})`;
    else if(f===1){e=`${a} − ${b} + ${c}`;alt=a-(b+c);}
    else if(f===2){if(b<=c)continue;e=`${a} − (${b} − ${c})`;}
    else if(f===3)e=`(${a} + ${b}) − (${c} + ${d})`;
    else if(f===4){if(b<=c)continue;e=`${a} + (${b} − ${c})`;}
    else{e=`${a} − ${b} − ${c}`;alt=a-(b-c);}
    const ev=evalExpr(e);if(ev.value<5)continue;
    return {f,a,b,c,e,ev,alt};
  }
}
function qKlammer(){
  const k=klammerExpr([0,1,2,3,4,5]),br=k.e.includes('(');
  return {type:'num',prompt:'( ) Rechne aus:',body:`<div class="expr">${k.e} = ?</div>`,answer:k.ev.value,
    hint:val=>{
      if(!br&&val===k.alt)return `Achtung: Hier gibt es <b>keine Klammer</b>! Dann rechnest du <b>von links nach rechts</b>: erst ${k.a} − ${k.b}.`;
      return br?'Was in der <b>Klammer</b> steht, rechnest du <b>zuerst</b>!':'Ohne Klammer rechnest du <b>von links nach rechts</b>.';},
    solution:(br?'':'<div>Keine Klammer → von links nach rechts.</div>')+stepsHTML(k.ev.steps),summary:`${k.e} = ${k.ev.value}`};
}
function qKlammerFirst(){
  const k=klammerExpr([0,1,2,5]);let first,other;
  if(k.f===0){first=`${k.b} + ${k.c}`;other=`${k.a} − ${k.b}`;}
  else if(k.f===2){first=`${k.b} − ${k.c}`;other=`${k.a} − ${k.b}`;}
  else if(k.f===1){first=`${k.a} − ${k.b}`;other=`${k.b} + ${k.c}`;}
  else{first=`${k.a} − ${k.b}`;other=`${k.b} − ${k.c}`;}
  const br=k.e.includes('(');
  return {type:'choice',prompt:'Was rechnest du <b>zuerst</b>?',body:`<div class="expr">${k.e}</div>`,options:shuffle([first,other,'Das ist egal']),answer:first,one:true,
    explain:`<div>${br?'Was in der <b>Klammer</b> steht, kommt zuerst.':'Ohne Klammer: <b>von links nach rechts</b>.'}</div>${stepsHTML(k.ev.steps)}`,summary:`Bei ${k.e} zuerst ${first}`};
}

function distractors(expr){
  const out=new Set(),idx=[];for(let i=0;i<expr.length;i++){if(expr[i]==='+'||expr[i]==='−')idx.push(i);}
  idx.forEach(i=>out.add(expr.slice(0,i)+(expr[i]==='+'?'−':'+')+expr.slice(i+1)));
  if(idx.length===1){const [x,,y]=expr.split(' ');out.add(`${y} − ${x}`);}
  out.delete(expr);return shuffle([...out]).slice(0,2);
}

}
function key(k){
  const q=cur();if(G.locked||!inputReady(q))return;
  if(k==='ok')return submit();
  if(k==='del')G.typed=G.typed.slice(0,-1);
  else if(G.typed.length<maxLen(q)){if(G.typed==='0')G.typed='';G.typed+=k;}
  updateTyped();
}
function next(){G.i++;if(G.i>=G.qs.length)endGame();else{renderQ();window.scrollTo({top:0,behavior:'smooth'});}}

function endGame(){
  const n=G.qs.length,pct=G.first/n,stars=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;
  store.stars+=stars;store.topics[G.mode]=stars;const rec=G.score>(store.high[G.mode]||0);if(rec)store.high[G.mode]=G.score;save();
  const tp=topicById(G.mode),st=STATE[stars];
  const msgs=['Nicht aufgeben! Schau dir den Merkzettel an und probier es nochmal. 💪','Gut! Schau dir die Fehler unten an und versuch’s nochmal.','Super gemacht! Noch ein bisschen üben, dann bist du Profi.','Wow – du bist ein echter Profi! 🏆'];
  let h=`<div class="bigstars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">⭐</span>`).join('')}</div>
   <div class="endmsg">${msgs[stars]}</div>
   <div class="check">${tp.n?`Checkliste Nr. ${tp.n} – ${tp.title}:`:'Probe-Klassenarbeit:'} <span class="state ${st[0]}">${st[1]}</span></div>
   ${rec&&G.score>0?'<div class="newrec">🎉 Neuer Rekord!</div>':''}
   <div class="stats"><div class="stat"><b>${G.score}</b><span>Punkte</span></div><div class="stat"><b>${G.first}/${n}</b><span>ohne Fehler</span></div><div class="stat"><b>🔥${G.best}</b><span>beste Serie</span></div></div>`;
  if(G.wrong.length)h+=`<h3 class="fred" style="margin:14px 0 4px">Das üben wir nochmal:</h3><ul class="mist">${G.wrong.map(w=>`<li>${w}</li>`).join('')}</ul>`;
  h+=`<div class="row"><button class="btn ghost" data-go="home">Checkliste</button><button class="btn" data-play="${G.mode}">Nochmal 🔁</button></div>`;
  $('#endcard').innerHTML=h;show('end');
  if(stars>=2){beep('win');confetti();}
}
function confetti(){
  const box=document.createElement('div');box.className='confetti';const em=['⭐','🎉','✨','➕','➖','🌟'];
  for(let i=0;i<40;i++){const s=document.createElement('span');s.textContent=pick(em);s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.9+'s';s.style.fontSize=(16+Math.random()*18)+'px';box.appendChild(s);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),4200);
}

/* ---------- Startseite ---------- */
const SETS=[['op','Rechenart',[['plus','➕ Plus'],['minus','➖ Minus'],['beides','beides']]],['carry','Übertrag',[['ohne','ohne'],['mit','mit'],['beides','gemischt']]],['digits','Zahlen',[[2,'2-stellig'],[3,'3-stellig'],[4,'4-stellig']]]];
function renderHome(){
  $('#starsTotal').textContent=store.stars;
  $('#soundBtn').textContent=store.sound?'🔊':'🔇';
  $('#topics').innerHTML=TOPICS.map(t=>{const s=store.topics[t.id];const st=s==null?['','noch offen']:STATE[s];
    return `<button class="topic" data-play="${t.id}"><div class="nr" style="background:${t.bg};color:${t.col}">${t.n}.</div><div class="tx"><b>${t.title}</b><span class="d">${t.desc}</span></div><span class="state ${st[0]}">${st[1]}</span></button>`;}).join('');
  $('#rec-test').textContent=store.high.test?`🏅 Rekord: ${store.high.test} Punkte`:'';
  $('#settings').innerHTML=SETS.map(([k,label,vals])=>`<div class="setrow"><div class="setlab">${label}</div><div class="seg">${vals.map(([v,t])=>`<button data-set="${k}" data-v="${v}" class="${String(store.settings[k])===String(v)?'on':''}">${t}</button>`).join('')}</div></div>`).join('');
}

/* ---------- Merkzettel ---------- */
function renderLearn(){
  const sa=solve(345,128,'+'),ss=solve(473,128,'-');
  const nav=['Fachbegriffe','Zahlenrätsel','Kopfrechnen','Schriftlich','Klammern','Rechengesetze','Sachaufgaben'].map((t,i)=>`<button data-jump="L${i+1}">${i+1}. ${t}</button>`).join('');
  $('#learnBody').innerHTML=`
  <div class="lnav">${nav}</div>
  <div class="lcard" id="L1"><h2>1. Fachbegriffe</h2>
    <p><b>Addition</b> – <b>addieren</b> = zusammenzählen = plus</p>
    ${eqHTML(345,128,'+',{labels:true})}
    <div class="merk">${T('Summand')} + ${T('Summand')} = ${T('Summe')}</div>
    <p><b>Subtraktion</b> – <b>subtrahieren</b> = abziehen = minus</p>
    ${eqHTML(473,128,'-',{labels:true})}
    <div class="merk">${T('Minuend')} − ${T('Subtrahend')} = ${T('Differenz')}</div>
    <p class="tip">🧠 Eselsbrücke: Im Alphabet kommt <b>M</b> vor <b>S</b> – also steht der <b>M</b>inuend vorne und der <b>S</b>ubtrahend dahinter. „Differenz“ heißt <b>Unterschied</b>.</p>
  </div>
  <div class="lcard" id="L2"><h2>2. Zahlenrätsel</h2>
    <table class="words"><tr><td>+</td><td>addiere, vermehre um, Summe, zusammen, insgesamt</td></tr><tr><td>−</td><td>subtrahiere, vermindere um, Differenz, Unterschied, um wie viel größer/kleiner</td></tr></table>
    <div class="merk">Subtrahiere 17 <span class="hl">von 63</span> → 63 − 17<br><span class="tip">Die Zahl nach „von“ steht vorne!</span></div>
    <div class="merk">Subtrahiere <span class="hl">die Summe aus 20 und 15</span> von 80<br>→ 80 − (20 + 15) = 80 − 35 = 45</div>
    <p class="tip">Wird eine Summe oder Differenz weiterverrechnet, kommt sie in eine <b>Klammer</b>.</p>
  </div>
  <div class="lcard" id="L3"><h2>3. Kopfrechnen</h2>
    <p>Zerlege die zweite Zahl und rechne Schritt für Schritt:</p>
    <div class="merk">47 + 38 → 47 + 30 = 77 → 77 + 8 = 85</div>
    <div class="merk">83 − 29 → 83 − 20 = 63 → 63 − 9 = 54</div>
    <p class="tip">Bei glatten Zahlen die Nullen kurz weglassen: 340 + 270 → 34 + 27 = 61 → 610</p>
  </div>
  <div class="lcard" id="L4"><h2>4. Schriftlich rechnen</h2>
    <p>Stellengerecht untereinander schreiben (Einer unter Einer …) und <b>rechts bei den Einern</b> anfangen. Ergibt eine Stelle 10 oder mehr, merkst du dir eine kleine <b style="color:var(--bad)">1</b> als <b>Übertrag</b>.</p>
    <div class="twocol">${columnHTML(345,128,'+',{result:473,carries:sa.carries,colors:{a:'c-summand',b:'c-summand',r:'c-summe'}})}${columnHTML(473,128,'-',{result:345,carries:ss.carries,colors:{a:'c-minuend',b:'c-subtrahend',r:'c-differenz'}})}</div>
    <p><b>Plus:</b></p>${stepsHTML(sa.steps)}
    <p><b>Minus:</b></p>${stepsHTML(ss.steps)}
    <div class="merk">Probe mit der Umkehraufgabe: 473 − 128 = 345 → 345 + 128 = 473 ✔</div>
  </div>
  <div class="lcard" id="L5"><h2>5. Klammern</h2>
    <div class="merk">Was in der Klammer steht, rechnest du <b>zuerst</b>.</div>
    <p>80 − (20 + 15) = 80 − 35 = <b>45</b></p>
    <div class="merk">Ohne Klammer rechnest du <b>von links nach rechts</b>.</div>
    <p>80 − 20 + 15 = 60 + 15 = <b>75</b></p>
    <p class="tip">Gleiche Zahlen – anderes Ergebnis! Die Klammer macht den Unterschied.</p>
  </div>
  <div class="lcard" id="L6"><h2>6. Rechengesetze</h2>
    <p><b>Kommutativgesetz</b> (Vertauschungsgesetz) – Zahlen vertauschen:</p>
    <div class="merk">a + b = b + a &nbsp;&nbsp; z. B. 25 + 38 = 38 + 25</div>
    <p><b>Assoziativgesetz</b> (Verbindungsgesetz) – Klammern versetzen:</p>
    <div class="merk">(a + b) + c = a + (b + c)</div>
    <p class="tip">⚠️ Beide Gesetze gelten nur für <b>Plus</b>, nicht für Minus!</p>
    <p><b>Geschickt rechnen:</b> Suche Zahlen, die zusammen eine glatte Zahl ergeben.</p>
    <div class="merk">38 + 59 + 62 = (38 + 62) + 59 = 100 + 59 = 159</div>
  </div>
  <div class="lcard" id="L7"><h2>7. Sachaufgaben</h2>
    <p>Gehe immer in drei Schritten vor:</p>
    <div class="merk">❓ <b>Frage:</b> Was soll ich herausfinden?<br>🧮 <b>Rechnung:</b> Kommt etwas dazu (+) oder geht etwas weg (−)?<br>💬 <b>Antwort:</b> Ganzer Satz mit Einheit (€, km, …).</div>
    <p class="tip">Beispiel: Tim kauft eine Hose für 25 € und Schuhe für 40 €. Er bezahlt mit 100 €.<br>Rechnung: 100 − (25 + 40) = 100 − 65 = 35<br>Antwort: Tim bekommt 35 € Wechselgeld.</p>
  </div>`;
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.jump){const el=document.getElementById(t.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(t.dataset.go){if(t.dataset.go==='learn')renderLearn();show(t.dataset.go);return;}
  if(t.dataset.play){startGame(t.dataset.play);return;}
  if(t.dataset.set){const k=t.dataset.set;store.settings[k]=k==='digits'?+t.dataset.v:t.dataset.v;save();renderHome();return;}
  if(t.id==='soundBtn'){store.sound=!store.sound;save();renderHome();if(store.sound)beep('ok');return;}
  if(t.classList.contains('opt')){choose(+t.dataset.i);return;}
  if(t.dataset.k){key(t.dataset.k);return;}
  if(t.id==='next'){next();return;}
});
document.addEventListener('keydown',e=>{
  if(!$('#game').classList.contains('on')||!G)return;
  const q=cur();
  if(e.key==='Enter'){e.preventDefault();if(G.locked)next();else if(inputReady(q))submit();return;}
  if(inputReady(q)){if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace'){e.preventDefault();key('del');}}
  else{const opts=q.type==='choice'?q.options:(q.pre&&!G.preDone?q.pre.options:null);if(opts&&/^[1-5]$/.test(e.key)&&+e.key<=opts.length&&!G.locked)choose(+e.key-1);}
});
renderHome();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>α-β-γ-Check · Physik 9F</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{--blau:#164A9C;--dblau:#0E2F66;--hblau:#1C69D4;--fblau:#EAF0FA;--orange:#E8833A;--dorange:#B4561A;--horange:#FFF1E4;--rot:#E2231A;--gruen:#2E9E4F;--a:#E8833A;--b:#1C69D4;--g:#2E9E4F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lexend',system-ui,sans-serif;background:#f4f7fc;color:#1d2433;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--dblau);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px}
header img{width:46px;height:46px;border-radius:50%;border:2px solid #fff;object-fit:cover;object-position:top;background:#fff}
header .t{font-family:Fredoka;font-weight:600;font-size:clamp(18px,2.6vw,26px)}
header .s{font-size:13px;opacity:.85}
.stripe{height:6px;background:linear-gradient(90deg,var(--hblau) 0 33.3%,var(--dblau) 33.3% 66.6%,var(--rot) 66.6% 100%)}
main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(14,47,102,.12);width:min(1000px,100%);padding:clamp(16px,3vw,32px)}
.btn{font-family:Lexend;font-weight:700;border:none;border-radius:14px;padding:14px 26px;font-size:clamp(17px,2vw,21px);cursor:pointer;color:#fff;background:var(--orange);box-shadow:0 4px 0 var(--dorange)}
.mid{text-align:center}
.mid img{height:clamp(160px,30vh,280px)}
h1,h2{font-family:Fredoka;font-weight:600;color:var(--blau)}
h1{font-size:clamp(32px,5vw,52px)} h2{font-size:clamp(26px,4vw,42px);margin:6px 0}
.mid p{font-size:clamp(16px,1.9vw,20px);color:#3b4658;margin:10px auto 18px;max-width:640px;line-height:1.5}
.top{display:flex;justify-content:space-between;font-weight:600;color:#4a5568;margin-bottom:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.dots span{width:22px;height:10px;border-radius:5px;background:#e3e9f3}
.dots span.ok{background:var(--gruen)} .dots span.no{background:var(--rot)} .dots span.cur{background:var(--blau)}
.qt{font-size:clamp(24px,3.4vw,38px);font-weight:600;color:var(--dblau);text-align:center;min-height:2.8em;display:flex;align-items:center;justify-content:center;line-height:1.3}
.keys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:26px}
.key{border:none;border-radius:20px;color:#fff;font-family:Fredoka;font-size:clamp(46px,8vw,84px);padding:14px 0;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative}
.key small{position:absolute;left:14px;top:10px;font-family:Lexend;font-size:16px;opacity:.8}
.ka{background:var(--a)} .kb{background:var(--b)} .kg{background:var(--g)}
.key.dim{opacity:.25} .key.right{outline:6px solid #1d2433}
.fb{margin-top:20px;border-radius:16px;padding:12px 16px;font-size:clamp(16px,1.9vw,20px);line-height:1.45;display:none;text-align:center}
.fb.ok{background:#E8F6EC;color:#1d5f32} .fb.no{background:#FDECEC;color:#8a1a14}
.fb b{font-family:Fredoka;font-size:1.2em}
.res{display:flex;gap:14px;justify-content:center;margin:14px 0}
.res div{border-radius:14px;padding:10px 22px;color:#fff;font-weight:700}
.res span{display:block;font-family:Fredoka;font-size:38px}
input{font-family:Lexend;font-size:20px;padding:12px 14px;border:2px solid #c9d6ec;border-radius:12px;width:min(320px,100%);margin-bottom:14px;text-align:center}
.hint{font-size:13px;color:#6b7280;margin-top:10px}
@media (max-width:600px){.keys{gap:8px}}
</style>
</head>

const app=document.getElementById('app');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const N=['α','β','γ'];
// [Aussage, richtige Strahlung 0/1/2, kurze Begründung]
const POOL=[
 ['Ich bin ein Heliumkern.',0,'α-Teilchen = 2 Protonen + 2 Neutronen.'],
 ['Ich bin ein Elektron aus dem Kern.',1,'β-Teilchen sind Elektronen.'],
 ['Ich bin eine elektromagnetische Welle.',2,'γ ist Energiestrahlung, wie Licht, nur energiereicher.'],
 ['Ich bin zweifach positiv geladen.',0,'2 Protonen → zweifach positiv.'],
 ['Ich bin einfach negativ geladen.',1,'Ein Elektron ist einfach negativ.'],
 ['Ich habe keine Ladung.',2,'γ-Strahlung ist neutral.'],
 ['Mich stoppt schon ein Blatt Papier.',0,'α hat die kleinste Reichweite.'],
 ['Mich stoppen 4–5 mm Aluminium.',1,'β kommt durch Papier, aber nicht durch Aluminium.'],
 ['Gegen mich braucht man dicke Bleiwände.',2,'γ dringt am weitesten durch.'],
 ['Ich komme in Luft nur wenige Zentimeter weit.',0,'α hat in Luft nur wenige cm Reichweite.'],
 ['Ich komme in Luft mehrere Meter weit.',1,'β reicht in Luft einige Meter.'],
 ['Ich ionisiere am stärksten.',0,'α ionisiert am stärksten – darum ist die Reichweite so klein.'],
 ['Ich ionisiere am schwächsten.',2,'γ ionisiert am wenigsten und kommt am weitesten.'],
 ['Nach mir ist die Massenzahl um 4 kleiner.',0,'Das α-Teilchen nimmt 4 Nukleonen mit.'],
 ['Nach mir ist die Ordnungszahl um 1 größer.',1,'Aus einem Neutron wird ein Proton.'],
 ['Nach mir ist es dasselbe Element.',2,'Bei γ ändern sich Protonen- und Neutronenzahl nicht.'],
 ['Ich entstehe, wenn sich ein Neutron in ein Proton umwandelt.',1,'n → p + e: das Elektron ist das β-Teilchen.'],
 ['Nach mir rutscht das Element 2 Felder nach links im PSE.',0,'Ordnungszahl −2 → 2 Felder nach links.'],
 ['Nach mir rutscht das Element 1 Feld nach rechts im PSE.',1,'Ordnungszahl +1 → 1 Feld nach rechts.'],
 ['Ich trete meist zusammen mit α- oder β-Strahlung auf.',2,'Der Kern gibt danach überschüssige Energie als γ ab.'],
 ['Ich bin keine Teilchenstrahlung.',2,'α und β sind Teilchen, γ nicht.'],
 ['²²²Rn → ²¹⁸Po + ?',0,'222 − 218 = 4 → Heliumkern, also α.'],
 ['¹⁴C → ¹⁴N + ?',1,'Massenzahl gleich, Ordnungszahl +1 → β.'],
 ['¹³⁷Ba* → ¹³⁷Ba + ?',2,'Nichts ändert sich außer der Energie → γ.'],
];
const ANZ=12;
let S=null;
function start(){
 S=null;
 app.innerHTML=`<div class="mid"><img src="${P.abg}" alt=""><h1>α-β-γ-Check</h1>
 <p>${ANZ} kurze Aussagen. Tippe, welche Strahlung gemeint ist: <b style="color:var(--a)">α</b>, <b style="color:var(--b)">β</b> oder <b style="color:var(--g)">γ</b>.<br>Falsche Antworten kommen am Ende noch einmal.</p>
 <input id="nm" placeholder="Dein Vorname" maxlength="24" autocomplete="off"><br>
 <button class="btn" id="go">Los geht's ⏎</button><div class="hint">Tasten 1 = α · 2 = β · 3 = γ · Enter = weiter</div></div>`;
 const nm=document.getElementById('nm'); nm.focus();
 const go=()=>begin(nm.value.trim()||'Profi');
 document.getElementById('go').onclick=go; nm.onkeydown=e=>{if(e.key==='Enter')go();};
}
function begin(name){
 const qs=shuffle(POOL).slice(0,ANZ).map((q,i)=>({q:q[0],a:q[1],e:q[2],id:i,first:true}));
 S={name,queue:qs,status:Array(ANZ).fill(''),erst:0,cur:null,answered:false,t0:Date.now()};
 next();
}
function next(){
 S.wait=null;
 if(!S.queue.length) return ende();
 S.cur=S.queue.shift(); S.answered=false; S.status[S.cur.id]=S.status[S.cur.id]==='no'?'no cur':'cur';
 const fertig=S.status.filter(x=>x==='ok').length;
 app.innerHTML=`<div class="top"><span>${S.name}</span><span>${fertig} / ${ANZ} geschafft${S.cur.first?'':' · 2. Versuch'}</span></div>
 <div class="dots">${S.status.map(s=>`<span class="${s}"></span>`).join('')}</div>
 <div class="qt">${S.cur.q}</div>
 <div class="keys">${N.map((n,i)=>`<button class="key k${'abg'[i]}" data-i="${i}"><small>${i+1}</small>${n}</button>`).join('')}</div>
 <div class="fb" id="fb"></div>`;
 app.querySelectorAll('.key').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
 if(S.answered) return; S.answered=true;
 const q=S.cur, ok=i===q.a;
 app.querySelectorAll('.key').forEach(b=>{const k=+b.dataset.i; if(k===q.a)b.classList.add('right'); else b.classList.add('dim');});
 if(ok){ S.status[q.id]='ok'; if(q.first) S.erst++; }
 else { S.status[q.id]='no'; S.queue.push({...q,first:false}); }
 const fb=document.getElementById('fb'); fb.className='fb '+(ok?'ok':'no'); fb.style.display='block';
 fb.innerHTML=`<b>${ok?rnd(['Richtig!','Stark!','Genau!']):'Leider falsch – richtig ist '+N[q.a]+'.'}</b><br>${q.e}<div style="margin-top:10px"><button class="btn" id="wb" style="background:var(--blau);box-shadow:0 4px 0 var(--dblau)">Weiter ⏎</button></div>`;
 document.getElementById('wb').onclick=next; S.wait=next;
 app.querySelector('.dots').innerHTML=S.status.map(s=>`<span class="${s}"></span>`).join('');
}
function ende(){
 const sek=Math.round((Date.now()-S.t0)/1000), pose=S.erst===ANZ?P.jubel:S.erst>=9?P.klatschen:P.lob;
 S.done=true;
 app.innerHTML=`<div class="mid"><img src="${pose}" alt=""><h2>Geschafft, ${S.name.replace(/</g,'')}!</h2>
 <div class="res"><div style="background:var(--gruen)">beim 1. Versuch<span>${S.erst} / ${ANZ}</span></div><div style="background:var(--orange)">Zeit<span>${Math.floor(sek/60)}:${String(sek%60).padStart(2,'0')}</span></div></div>
 <p>${S.erst===ANZ?'Alles sofort richtig – du bist ein echter Strahlen-Profi!':'Alle Aussagen sitzen jetzt. Spiel noch eine Runde und versuch, beim ersten Mal alles richtig zu haben.'}</p>
 <button class="btn" id="again">Neue Runde ⏎</button></div>`;
 document.getElementById('again').onclick=()=>begin(S.name);
}
document.addEventListener('keydown',e=>{
 if(!S) return;
 if(S.done){ if(e.key==='Enter') begin(S.name); return; }
 if(e.key==='Enter' && S.wait){ e.preventDefault(); S.wait(); return; }
 const n=+e.key; if(!S.answered && n>=1 && n<=3) answer(n-1);
});
start();
</script>

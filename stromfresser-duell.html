<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stromfresser-Duell · Physik 10</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blau:#164A9C;--dblau:#0E2F66;--hblau:#1C69D4;--fblau:#EAF0FA;--orange:#E8833A;--dorange:#B4561A;--horange:#FFF1E4;--rot:#E2231A;--violett:#7A4FD0;--gruen:#2E9E4F;--gelb:#E0A800;--hgelb:#FFF8DC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Lexend',system-ui,sans-serif;background:#f4f7fc;color:#1d2433;display:flex;flex-direction:column}
h1,h2,h3,.fred{font-family:'Fredoka','Lexend',sans-serif;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--dblau);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px}
header .logo{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
header .t{font-family:Fredoka;font-weight:600;font-size:clamp(18px,2.6vw,28px)}
header .s{font-size:13px;opacity:.85}
header .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.home{background:transparent;border:2px solid #fff;color:#fff;border-radius:10px;padding:6px 12px;font-size:14px}
.stripe{height:6px;background:linear-gradient(90deg,var(--hblau) 0 33.3%,var(--dblau) 33.3% 66.6%,var(--rot) 66.6% 100%)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(14,47,102,.12);width:min(1150px,100%);padding:clamp(18px,3vw,36px);position:relative}
/* Start */
.start{display:flex;gap:30px;align-items:center}
.start>img{height:clamp(160px,30vh,290px)}
.start h1{color:var(--blau);font-size:clamp(30px,5vw,56px);line-height:1.05}
.start p{margin:12px 0 16px;font-size:clamp(15px,1.8vw,20px);color:#3b4658;line-height:1.45}
.lbl{font-weight:700;color:var(--dblau);font-size:15px;margin:6px 0 8px}
.lv{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.lv button{background:#fff;border:2.5px solid #c9d6ec;border-radius:14px;padding:10px 16px;font-size:16px;text-align:left;min-height:54px}
.lv button .d{color:var(--blau);letter-spacing:2px;margin-right:6px}
.lv button small{display:block;font-size:12px;color:#6b7280}
.lv button.on{border-color:var(--blau);background:var(--fblau);box-shadow:0 0 0 3px rgba(22,74,156,.15)}
.modes{display:flex;gap:16px;flex-wrap:wrap}
.btn{font-family:Lexend;font-weight:700;border:none;border-radius:16px;padding:16px 24px;font-size:clamp(17px,2vw,22px);color:#fff;background:var(--blau);box-shadow:0 4px 0 var(--dblau);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dblau)}
.btn.or{background:var(--orange);box-shadow:0 4px 0 var(--dorange)}
.btn small{display:block;font-weight:400;font-size:13px;opacity:.92;margin-top:4px}
.hint{font-size:13px;color:#6b7280;margin-top:14px}
/* Kopfzeile Spiel */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pill{border-radius:999px;padding:8px 16px;font-weight:700;font-size:clamp(14px,1.6vw,18px)}
.team-b{background:var(--hblau);color:#fff}.team-o{background:var(--orange);color:#fff}
.team-b.off,.team-o.off{opacity:.35}
.niv{background:var(--fblau);color:var(--dblau)}
.timer{margin-left:auto;font-family:Fredoka;font-size:clamp(26px,3.4vw,40px);color:var(--dblau);min-width:90px;text-align:right}
.timer.low{color:var(--rot)}
.bar{height:8px;background:#e6ecf6;border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:var(--hblau);transition:width .25s linear}
.qnr{font-size:14px;color:#6b7280;margin-bottom:6px;font-weight:600}
.typ{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 10px;margin-right:8px;color:#fff;background:var(--blau);vertical-align:2px}
.typ.d{background:var(--rot)}.typ.k{background:var(--violett)}.typ.u{background:var(--dgelb,#B8860B)}
.qt{font-size:clamp(20px,2.7vw,32px);line-height:1.35;font-weight:600;color:var(--dblau)}
.qt .g{color:var(--blau)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;border:3px solid #c9d6ec;background:var(--fblau);border-radius:16px;padding:14px 18px;font-size:clamp(18px,2.3vw,27px);text-align:left;color:#1d2433;min-height:70px}
.opt b{background:var(--dblau);color:#fff;border-radius:10px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.opt:hover{border-color:var(--hblau)}
.opt.ok{border-color:var(--gruen);background:#E8F6EC}.opt.ok b{background:var(--gruen)}
.opt.no{border-color:var(--rot);background:#FDECEC}.opt.no b{background:var(--rot)}
.opt[disabled]{cursor:default}
/* Duell */
.duell{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-top:18px}
.vs{align-self:center;font-family:Fredoka;font-size:clamp(28px,4vw,46px);color:var(--rot)}
.dev{border:3px solid #c9d6ec;background:var(--fblau);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:transform .12s}
.dev:hover:not([disabled]){border-color:var(--hblau);transform:translateY(-3px)}
.dev .k{align-self:flex-start;background:var(--dblau);color:#fff;border-radius:10px;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.dev svg{width:clamp(70px,11vw,110px);height:clamp(70px,11vw,110px)}
.dev .n{font-family:Fredoka;font-weight:600;font-size:clamp(22px,2.8vw,32px);color:var(--dblau)}
.dev .w{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dev .w span{background:#fff;border:1.5px solid #c9d6ec;border-radius:10px;padding:4px 10px;font-size:clamp(15px,1.8vw,20px);font-weight:600}
.dev .w span.t{border-color:var(--orange);background:var(--horange)}
.dev.ok{border-color:var(--gruen);background:#E8F6EC}.dev.ok .k{background:var(--gruen)}
.dev.no{border-color:var(--rot);background:#FDECEC}.dev.no .k{background:var(--rot)}
.dev[disabled]{cursor:default}
.ebar{width:100%;height:26px;background:#fff;border:1.5px solid #c9d6ec;border-radius:9px;overflow:hidden;margin-top:6px;display:none}
.ebar div{height:100%;width:0;background:linear-gradient(90deg,var(--gelb),var(--orange));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.eval{font-family:Fredoka;font-size:clamp(20px,2.4vw,28px);color:var(--dorange);display:none}
.show .ebar,.show .eval{display:block}
/* Rückmeldung */
.fb{display:none;margin-top:18px;border-radius:16px;padding:14px 18px 14px 86px;position:relative;font-size:clamp(16px,1.9vw,21px);line-height:1.55;min-height:80px}
.fb .sy{position:absolute;left:16px;top:16px;width:52px;height:52px;border-radius:50%;color:#fff;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fb.ok{background:#E8F6EC;border:2px solid var(--gruen)}.fb.ok .sy{background:var(--gruen)}
.fb.no{background:#FDECEC;border:2px solid var(--rot)}.fb.no .sy{background:var(--rot)}
.fb .h{font-family:Fredoka;font-weight:600;font-size:clamp(20px,2.4vw,28px)}
.fb.ok .h{color:var(--gruen)}.fb.no .h{color:var(--rot)}
.fb .weg{background:#fff;border-radius:10px;padding:6px 12px;margin-top:6px;display:inline-block}
.weiter{margin-top:12px;text-align:right}
/* Ergebnis */
.res{text-align:center}
.res .pokal{font-size:70px;line-height:1}
.res h2{font-size:clamp(28px,4vw,48px);color:var(--blau);margin:6px 0}
.scores{display:flex;gap:20px;justify-content:center;margin:14px 0 18px;flex-wrap:wrap}
.scores div{border-radius:18px;padding:14px 28px;color:#fff;font-size:20px;font-weight:700}
.scores span{display:block;font-family:Fredoka;font-size:42px}
.hit{max-width:760px;margin:0 auto 20px;text-align:left;background:var(--hgelb);border:2px solid var(--gelb);border-radius:16px;padding:12px 18px}
.hit h3{color:var(--dblau);font-size:22px;margin-bottom:6px}
.hit .z{display:grid;grid-template-columns:28px 30px 160px 1fr 110px;gap:8px;align-items:center;font-size:15px;margin:4px 0}
.hit .z svg{width:28px;height:28px}
.hit .z .b{height:16px;background:#fff;border-radius:6px;overflow:hidden}
.hit .z .b div{height:100%;background:linear-gradient(90deg,var(--gelb),var(--orange));width:0;transition:width 1.2s}
.hit .z .v{text-align:right;font-weight:700;color:var(--dorange)}
@media (max-width:760px){.opts{grid-template-columns:1fr}.start{flex-direction:column;text-align:center}.modes,.lv{justify-content:center}
.duell{grid-template-columns:1fr}.vs{text-align:center}.fb{padding-left:18px}.fb .sy{display:none}.hit .z{grid-template-columns:24px 26px 1fr 70px}.hit .z .b{display:none}}
</style>
</head>

// ---------- Hilfsfunktionen ----------
function fmt(x){
  let r=Math.round(x*1000)/1000;
  let s=r.toString().split('.');
  let i=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return s[1]?i+','+s[1]:i;
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const r3=x=>Math.round(x*1000)/1000;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function opts(correct,cands){
  const set=[r3(correct)];
  for(let c of cands){ c=r3(c); if(set.length>=4)break; if(c>0 && !set.some(v=>Math.abs(v-c)<1e-9)) set.push(c);}
  let k=2; while(set.length<4){const c=r3(correct*k); if(!set.some(v=>Math.abs(v-c)<1e-9))set.push(c); k++;}
  return set;
}

  }else{
   const c=x.E;
   o=opts(c,[x.d.I*x.th, 230*x.d.I*(min?mval:x.th*10), c/1000, c*10, (230+x.d.I)*x.th]);
   q=`<span class="g">${x.d.n}</span>: U = 230 V, I = ${fmt(x.d.I)} A, Nutzung ${x.tl}. Wie viel Energie braucht das Gerät?`;
   e=`P = 230 V · ${fmt(x.d.I)} A = ${fmt(x.P)} W${min?` · ${x.tl} = ${fmt(x.th)} h`:''}<br><span class="weg">E = ${fmt(x.P)} W · ${fmt(x.th)} h = <b>${fmt(c)} Wh</b>${c>=1000?` = ${fmt(c/1000)} kWh`:''}</span>`;
   o=o.map(v=>fmt(v)+' Wh');
  }
  merk(x);
  return {type:'mc',tag:'Energie',q,o,a:0,e};
 },
 umrechnen(){
  const k=ri(0,LV===2?2:0);
  if(k===0){
   const m=rnd([6,12,15,30,45,90,3,18]), c=m/60;
   const o=opts(c,[m/100,m/10,m*60,m/6]);
   return {type:'mc',tag:'Umrechnen',q:`Wie viele Stunden sind <span class="g">${m} Minuten</span>?`,o:o.map(v=>fmt(v)+' h'),a:0,e:`Minuten : 60<br><span class="weg">${m} min : 60 = <b>${fmt(c)} h</b></span>`};
  }
  if(k===1){
   const w=rnd([500,1500,2500,250,4000,750,12000]), c=w/1000;
   const o=opts(c,[w/100,w/10,w*1000,w/60]);
   return {type:'mc',tag:'Umrechnen',q:`Wie viele Kilowattstunden sind <span class="g">${fmt(w)} Wh</span>?`,o:o.map(v=>fmt(v)+' kWh'),a:0,e:`1 kWh = 1000 Wh → durch 1000 teilen<br><span class="weg">${fmt(w)} Wh = <b>${fmt(c)} kWh</b></span>`};
  }
  const kw=rnd([0.5,1.2,2,3.5,0.25,0.08]), c=kw*1000;
  const o=opts(c,[kw*100,kw*10,kw/1000,kw*60]);
  return {type:'mc',tag:'Umrechnen',q:`Wie viele Wattstunden sind <span class="g">${fmt(kw)} kWh</span>?`,o:o.map(v=>fmt(v)+' Wh'),a:0,e:`1 kWh = 1000 Wh → mal 1000<br><span class="weg">${fmt(kw)} kWh = <b>${fmt(c)} Wh</b></span>`};
 },
 konzept(){
  const pool=[
   {q:'In welcher Einheit gibt man die elektrische Energie an?',r:'Wattstunden (Wh)',f:['Watt (W)','Ampere (A)','Volt (V)'],e:'Die Energie misst man in Wh oder kWh. Watt ist die Einheit der Leistung.'},
   {q:'Welche Spannung liegt an einer normalen Steckdose in Deutschland an?',r:'230 V',f:['12 V','110 V','1000 V'],e:'Haushaltssteckdosen in Deutschland haben 230 V.'},
   {q:'Zwei Geräte laufen gleich lange. Welches braucht mehr Energie?',r:'das Gerät mit der größeren Leistung',f:['das Gerät mit der kleineren Leistung','beide gleich viel','das leichtere Gerät'],e:'E = P · t. Bei gleicher Zeit entscheidet die Leistung.'},
   {q:'Ein Gerät mit kleiner Leistung braucht viel Energie, wenn …',r:'… es sehr lange läuft.',f:['… es nur kurz läuft.','… die Spannung klein ist.','… es ausgeschaltet ist.'],e:'E = P · t. Eine lange Zeit kann eine kleine Leistung ausgleichen. Beispiel: WLAN-Router, 24 h am Tag.'},
   {q:'Die Stromstärke verdoppelt sich, die Spannung bleibt gleich. Was passiert mit der Leistung?',r:'Sie verdoppelt sich.',f:['Sie halbiert sich.','Sie bleibt gleich.','Sie vervierfacht sich.'],e:'P = U · I. Doppelte Stromstärke → doppelte Leistung.'},
   {q:'Ein Gerät läuft doppelt so lange. Was passiert mit der Energie?',r:'Sie verdoppelt sich.',f:['Sie bleibt gleich.','Sie halbiert sich.','Die Leistung verdoppelt sich.'],e:'E = P · t. Doppelte Zeit → doppelte Energie. Die Leistung bleibt gleich.'},
   {q:'Was zeigt der Stromzähler im Haus an?',r:'die Energie in kWh',f:['die Leistung in W','die Spannung in V','die Stromstärke in A'],e:'Der Stromzähler zählt die genutzte Energie in Kilowattstunden. Danach wird bezahlt.'},
   {q:'Welche Formel ist richtig?',r:'P = U · I',f:['P = U : I','P = U + I','P = I : U'],e:'Leistung = Spannung mal Stromstärke. 1 W = 1 V · 1 A.'},
   {q:'Was bedeutet 1 Wh?',r:'Ein Gerät mit 1 W läuft 1 Stunde.',f:['Ein Gerät mit 1 V läuft 1 Stunde.','Ein Gerät mit 1 W läuft 1 Minute.','1 Ampere fließt 1 Stunde.'],e:'E = P · t: 1 W · 1 h = 1 Wh.'},
   {q:'Welches Gerät hat die größte Leistung?',r:'Wasserkocher',f:['WLAN-Router','LED-Lampe','Handy-Ladegerät'],e:'Der Wasserkocher hat etwa 2000 W, der Router nur etwa 10 W. Aber: Leistung ist nicht gleich Energie!'},
  ];
  const p=rnd(pool); return {type:'mc',tag:'Wissen',q:p.q,o:[p.r,...p.f],a:0,e:p.e};
 }
};
const MIX=[
 ['duell','duell','duell','duell','leistung','leistung','energie','energie','energie','konzept','konzept'],
 ['duell','duell','duell','duell','leistung','leistung','energie','energie','energie','umrechnen','konzept','konzept'],
 ['duell','duell','duell','duell','leistung','strom','energie','energie','energie','umrechnen','umrechnen','konzept'],
];
let lastG='';
function newQ(){
  let g; do{g=rnd(MIX[LV]);}while(g===lastG && g!=='duell'); lastG=g;
  const q=GEN[g]();
  if(q.type==='mc'){const idx=shuffle([0,1,2,3]); q.o=idx.map(i=>q.o[i]); q.a=idx.indexOf(0);}
  return q;
}

// ---------- Spielablauf ----------
let S=null, tick=null;
const NQ=12, TQ=[45,45,60], TB=120;
function stop(){clearInterval(tick);tick=null;}
function startScreen(){
  S=null; stop(); homeBtn.style.display='none';
  app.innerHTML=`<div class="start"><img src="${WINKEN}" alt=""><div>
  <h1>Stromfresser-Duell</h1>
  <p>Welches Gerät frisst am Tag mehr Energie? Vergleiche Geräte aus dem Alltag, rechne mit <b>P = U · I</b> und <b>E = P · t</b> und sammle Punkte.</p>
  <div class="lbl">Niveau wählen</div>
  <div class="lv">${LVN.map((n,i)=>`<button data-l="${i}" class="${i===LV?'on':''}"><span class="d">${n.split(' ')[1]}</span>${n.split(' ')[0]}<small>${['Zeit in Stunden, glatte Zahlen','Zeit in Minuten umrechnen','U und I statt P, kWh'][i]}</small></button>`).join('')}</div>
  <div class="modes">
   <button class="btn" id="m1">Klassenduell<small>Team Blau gegen Team Orange · ${NQ} Fragen</small></button>
   <button class="btn or" id="m2">Blitzrunde<small>${TB} Sekunden · so viele wie möglich</small></button>
  </div><div class="hint">Tasten: 1–4 zum Antworten, Enter für weiter · Niveau mit B, S, E</div></div></div>`;
  app.querySelectorAll('.lv button').forEach(b=>b.onclick=()=>{LV=+b.dataset.l;startScreen();});
  document.getElementById('m1').onclick=()=>begin('duell');
  document.getElementById('m2').onclick=()=>begin('blitz');
}
function begin(mode){
  homeBtn.style.display='';
  S={mode,nr:0,team:0,pts:[0,0],richtig:0,falsch:0,answered:false,left:mode==='duell'?TQ[LV]:TB,total:mode==='duell'?TQ[LV]:TB,seen:{}};
  if(mode==='blitz'){stop();tick=setInterval(()=>{S.left--;updTimer();if(S.left<=0){stop();if(!S.answered)result();}},1000);}
  next();
}
function updTimer(){
  const t=document.getElementById('tm'); if(!t)return;
  t.textContent=Math.max(0,S.left)+' s'; t.classList.toggle('low',S.left<=10);
  const b=document.getElementById('br'); if(b)b.style.width=(100*Math.max(0,S.left)/S.total)+'%';
}
function next(){
  if(S.mode==='duell'&&S.nr>=NQ){stop();return result();}
  if(S.mode==='blitz'&&S.left<=0){return result();}
  S.cur=newQ(); S.answered=false; S.nr++;
  if(S.mode==='duell'){S.team=(S.nr-1)%2;S.left=TQ[LV];stop();tick=setInterval(()=>{S.left--;updTimer();if(S.left<=0){stop();answer(-1);}},1000);}
  render();
}
function devCard(x,k){
  const w=LV===2?`<span>U = 230 V</span><span>I = ${fmt(x.d.I)} A</span>`:`<span>P = ${fmt(x.P)} W</span>`;
  return `<button class="dev" data-i="${k}"><span class="k">${k+1}</span>${svg(x.d.ic)}<div class="n">${x.d.n}</div>
  <div class="w">${w}<span class="t">⏱ ${tText(x)} pro Tag</span></div>
  <div class="ebar"><div></div></div><div class="eval"></div></button>`;
}
function render(){
  const q=S.cur;
  const top=S.mode==='duell'
   ?`<span class="pill team-b ${S.team?'off':''}">Team Blau: ${S.pts[0]}</span><span class="pill team-o ${S.team?'':'off'}">Team Orange: ${S.pts[1]}</span>`
   :`<span class="pill team-b">Punkte: ${S.pts[0]}</span><span class="pill" style="background:#E8F6EC;color:#2E9E4F">✓ ${S.richtig}</span>`;
  const nr=S.mode==='duell'?`Frage ${S.nr} von ${NQ} · ${S.team?'Team Orange':'Team Blau'} ist dran`:`Frage ${S.nr}`;
  let body;
  if(q.type==='duell'){
   body=`<div class="qnr">${nr}</div><div class="qt"><span class="typ d">Duell</span>Wer frisst an einem Tag mehr Energie?</div>
   <div class="duell">${devCard(q.a,0)}<div class="vs">VS</div>${devCard(q.b,1)}</div>`;
  }else{
   body=`<div class="qnr">${nr}</div><div class="qt"><span class="typ ${q.tag==='Wissen'?'k':q.tag==='Umrechnen'?'u':''}">${q.tag}</span>${q.q}</div>
   <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${i+1}</b><span>${o}</span></button>`).join('')}</div>`;
  }
  app.innerHTML=`<div class="top">${top}<span class="pill niv">${LVN[LV]}</span><span class="timer" id="tm">${S.left} s</span></div>
  <div class="bar"><div id="br" style="width:${100*S.left/S.total}%"></div></div>${body}<div class="fb" id="fb"></div>`;
  app.querySelectorAll('.opt,.dev').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  if(S.answered)return; S.answered=true; if(S.mode==='duell')stop();
  const q=S.cur, corr=q.type==='duell'?q.ans:q.a, ok=i===corr;
  let weg='';
  if(q.type==='duell'){
   const mx=Math.max(q.a.E,q.b.E);
   app.querySelectorAll('.dev').forEach((b,k)=>{
    const x=k?q.b:q.a; b.disabled=true; b.classList.add('show');
    if(k===corr)b.classList.add('ok'); else if(k===i)b.classList.add('no');
    b.querySelector('.eval').textContent=fmt(x.E)+' Wh';
    setTimeout(()=>b.querySelector('.ebar div').style.width=Math.max(2,100*x.E/mx)+'%',60);
    merk(x);
   });
   const zeile=x=>{
     let s='';
     if(LV===2) s+=`P = 230 V · ${fmt(x.d.I)} A = ${fmt(x.P)} W · `;
     if(x.tl.includes('min')&&LV>0) s+=`${x.tl} = ${fmt(x.th)} h · `;
     return s+`E = ${fmt(x.P)} W · ${fmt(x.th)} h = <b>${fmt(x.E)} Wh</b>`;
   };
   const W=corr?q.b:q.a, L=corr?q.a:q.b;
   const ART=n=>['Mikrowelle','Spielkonsole','LED-Lampe','Glühlampe','Aquarium-Heizung'].includes(n)?'Die':'Der';
   const tipp=W.P<L.P?`${ART(W.d.n)} ${W.d.n} hat die <b>kleinere Leistung</b>, läuft aber viel länger. Die Zeit macht den Unterschied!`
     :W.th<L.th?`${ART(W.d.n)} ${W.d.n} läuft kürzer, hat aber eine viel größere Leistung.`
     :W.th>L.th?`${ART(W.d.n)} ${W.d.n} hat die größere Leistung und läuft auch noch länger.`:`Beide laufen gleich lange. ${ART(W.d.n)} ${W.d.n} hat die größere Leistung.`;
   weg=`<b>${q.a.d.n}:</b> <span class="weg">${zeile(q.a)}</span><br><b>${q.b.d.n}:</b> <span class="weg">${zeile(q.b)}</span><br>${tipp}`;
  }else{
   app.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===corr)b.classList.add('ok');else if(k===i)b.classList.add('no');});
   weg=(ok?'':`Richtig ist: <b>${q.o[corr]}</b><br>`)+q.e;
  }
  let plus=0;
  if(ok){S.richtig++; plus=100+(S.mode==='duell'?S.left*5:0); S.pts[S.mode==='duell'?S.team:0]+=plus;} else S.falsch++;
  const fb=document.getElementById('fb'); fb.className='fb '+(ok?'ok':'no'); fb.style.display='block';
  const last=(S.mode==='duell'&&S.nr>=NQ)||(S.mode==='blitz'&&S.left<=0);
  fb.innerHTML=`<div class="sy">${ok?'✓':'✗'}</div><div class="h">${ok?`Richtig! +${plus} Punkte`:(i<0?'Die Zeit ist um!':'Leider falsch.')}</div>
   ${weg}<div class="weiter"><button class="btn" id="wb">${last?'Ergebnis':'Weiter'} ⏎</button></div>`;
  document.getElementById('wb').onclick=next;
  if(q.type==='duell') setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),300);
}
function result(){
  stop(); const d=S.mode==='duell';
  let txt;
  if(d){const [b,o]=S.pts; txt=b>o?'Team Blau gewinnt!':o>b?'Team Orange gewinnt!':'Unentschieden!';}
  else txt=`${S.richtig} richtige Antworten!`;
  const list=Object.entries(S.seen).sort((a,b)=>b[1].E-a[1].E).slice(0,8);
  const mx=list.length?list[0][1].E:1;
  const hit=list.length>=3?`<div class="hit"><h3>Stromfresser-Hitliste dieser Runde</h3>
   ${list.map(([n,v],k)=>`<div class="z"><b>${k+1}.</b>${svg(v.ic)}<span>${n}</span><div class="b"><div data-w="${Math.max(2,100*v.E/mx)}"></div></div><span class="v">${fmt(v.E)} Wh</span></div>`).join('')}
   <div style="font-size:13px;color:#6b7280;margin-top:6px">Energie pro Tag, E = P · t</div></div>`:'';
  app.innerHTML=`<div class="res"><div class="pokal">🏆</div><h2>${txt}</h2>
  <div class="scores">${d?`<div style="background:var(--hblau)">Team Blau<span>${S.pts[0]}</span></div><div style="background:var(--orange)">Team Orange<span>${S.pts[1]}</span></div>`
   :`<div style="background:var(--hblau)">Punkte<span>${S.pts[0]}</span></div><div style="background:#2E9E4F">Richtig<span>${S.richtig}</span></div><div style="background:var(--rot)">Falsch<span>${S.falsch}</span></div>`}</div>
  ${hit}
  <div class="modes" style="justify-content:center"><button class="btn" id="again">Nochmal spielen ⏎</button><button class="btn or" id="menu">Zum Start</button></div></div>`;
  setTimeout(()=>app.querySelectorAll('.hit .b div').forEach(x=>x.style.width=x.dataset.w+'%'),80);
  S.done=true;
  document.getElementById('again').onclick=()=>begin(S.mode);
  document.getElementById('menu').onclick=startScreen;
}
document.addEventListener('keydown',e=>{
  if(!S){ const m={b:0,s:1,e:2}[e.key.toLowerCase()]; if(m!==undefined){LV=m;startScreen();}
          if(e.key==='1')begin('duell'); if(e.key==='2')begin('blitz'); return; }
  if(S.done){ if(e.key==='Enter')begin(S.mode); return; }
  const n=S.cur&&S.cur.type==='duell'?2:4;
  if(!S.answered && +e.key>=1 && +e.key<=n) answer(+e.key-1);
  else if(S.answered && e.key==='Enter') next();
});
startScreen();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dur-Moll-Spiele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--musik:#6A4BB5;--kunst:#D9541E;--dur:#F2A516;--moll:#3F6DB5;--ink:#2b2633;--bg:#F6F1FB;--card:#fff;--line:#e3dcec}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
h1,h2,h3,.big{font-family:Fredoka,Nunito,sans-serif}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:800}
button:focus-visible{outline:4px solid #000;outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--musik);color:#fff;flex-wrap:wrap}
.top .logo{font-family:Fredoka;font-size:22px;font-weight:700;margin-right:auto}
.chip{background:rgba(255,255,255,.18);color:#fff;padding:6px 12px;font-size:14px;border-radius:999px}
.chip.on{background:#fff;color:var(--musik)}
.chip.done{background:rgba(255,255,255,.4)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px;gap:16px;width:100%;max-width:1200px;margin:0 auto}
.card{background:var(--card);border-radius:22px;padding:22px 26px;box-shadow:0 2px 0 var(--line),0 8px 28px rgba(80,50,120,.08);width:100%}
.how{font-size:20px;line-height:1.45}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.play{background:var(--musik);color:#fff;font-size:24px;padding:16px 28px;display:inline-flex;align-items:center;gap:10px}
.play.alt{background:var(--kunst)}
.play.ghost{background:#efe9f7;color:var(--musik)}
.reveal{background:#2b2633;color:#fff;font-size:22px;padding:14px 26px}
.next{background:#0F7B6C;color:#fff;font-size:22px;padding:14px 26px}
.answer{font-family:Fredoka;font-size:64px;font-weight:700;text-align:center;line-height:1.1;padding:8px 0}
.answer.dur{color:var(--dur)}.answer.moll{color:var(--moll)}
.answer small{display:block;font-size:24px;color:var(--ink);font-family:Nunito;font-weight:700;margin-top:6px}
.counter{font-size:16px;font-weight:800;color:#6b6475}
.title{font-size:40px;margin:0;color:var(--musik)}
.timer{font-family:Fredoka;font-size:120px;font-weight:700;color:var(--kunst);text-align:center;line-height:1}
.teams{display:grid;gap:12px;width:100%}
.team{border-radius:18px;padding:12px 14px;color:#fff;display:flex;flex-direction:column;gap:8px;align-items:center}
.team .nm{font-family:Fredoka;font-size:22px;font-weight:700;text-align:center}
.team .sc{font-family:Fredoka;font-size:44px;font-weight:700;line-height:1}
.team .ok{background:#fff;color:var(--ink);font-size:18px;padding:10px 14px;width:100%}
.team .ok.on{background:#1f9d55;color:#fff}
.team .adj{display:flex;gap:6px}
.team .adj button{background:rgba(255,255,255,.25);color:#fff;width:34px;height:30px;font-size:18px;padding:0}
.kb{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.steps{display:flex;gap:6px;justify-content:center;margin-top:6px}
.steps span{font-family:Fredoka;font-size:28px;font-weight:700;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#efe9f7;color:var(--musik)}
.steps span.h{background:var(--kunst);color:#fff}
.start label{font-weight:800;font-size:18px}
.start input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;width:100%}
.seg button{background:#efe9f7;color:var(--musik);font-size:22px;padding:10px 22px}
.seg button.on{background:var(--musik);color:#fff}
.teach{background:#FFF7E6;border:2px dashed var(--dur);border-radius:16px;padding:14px 18px;font-size:16px;line-height:1.5}
.teach b{color:#9a5b00}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;width:100%}
.legend{display:flex;gap:18px;justify-content:center;font-size:20px;font-weight:800}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:10px}
.podium div{border-radius:16px 16px 0 0;color:#fff;width:180px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 8px;font-family:Fredoka;font-weight:700}
.conf{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hide{display:none!important}
.small{font-size:15px;color:#6b6475}
@media (max-width:700px){.answer{font-size:44px}.title{font-size:30px}.how{font-size:17px}}
</style>
</head>
<body>
<div class="top">
  <button class="logo" id="home" style="background:none;color:#fff;padding:0;text-align:left">🎵 Dur-Moll-Spiele</button>
  <div id="chips" class="row" style="justify-content:flex-end"></div>
</div>
<main id="app"></main>
<div style="padding:0 18px 18px"><div id="teams" class="teams" style="max-width:1200px;margin:0 auto"></div></div>

<script>
// ---------- Audio ----------
let ctx=null, master=null, live=[], timers=[];
function ac(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor();
    master=ctx.createGain(); master.gain.value=0.55;
    master.connect(comp); comp.connect(ctx.destination);
  }
  if(ctx.state==='suspended') ctx.resume();
  return ctx;
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(m,t,dur,vel=0.32){
  const c=ac(), g=c.createGain(), o1=c.createOscillator(), o2=c.createOscillator(), g2=c.createGain();
  o1.type='triangle'; o1.frequency.value=hz(m);
  o2.type='sine'; o2.frequency.value=hz(m)*2; g2.gain.value=0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vel,t+0.012);
  g.gain.exponentialRampToValueAtTime(vel*0.45,t+0.25);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.55);
  o1.start(t); o2.start(t); o1.stop(t+dur+0.6); o2.stop(t+dur+0.6);
  live.push(o1,o2);
  const now=c.currentTime;
  timers.push(setTimeout(()=>light(m,true),Math.max(0,(t-now)*1000)));
  timers.push(setTimeout(()=>light(m,false),Math.max(0,(t-now+dur)*1000)));
}
function stopAll(){
  live.forEach(o=>{try{o.stop()}catch(e){}}); live=[];
  timers.forEach(clearTimeout); timers=[];
  document.querySelectorAll('.kb .k').forEach(k=>k.classList.remove('lit'));
  document.querySelectorAll('.kb rect[data-m]').forEach(k=>k.setAttribute('fill',k.dataset.base));
}
const DUR=[0,2,4,5,7,9,11], MOLL=[0,2,3,5,7,8,10];
function triad(root,minor){return [root,root+(minor?3:4),root+7]}
function playChord(root,minor,fast){
  stopAll(); const c=ac(); let t=c.currentTime+0.08; const tr=triad(root,minor), step=fast?0.28:0.42;
  tr.forEach((m,i)=>note(m,t+i*step,step*0.95));
  const tt=t+3*step+0.15;
  tr.forEach(m=>note(m,tt,1.6,0.24)); note(root-12,tt,1.6,0.22);
  return (tt-c.currentTime+1.7)*1000;
}
function playScale(root,minor){
  stopAll(); const c=ac(); let t=c.currentTime+0.08; const sc=minor?MOLL:DUR;
  const ms=[...sc.map(s=>root+s),root+12];
  ms.forEach((m,i)=>note(m,t+i*0.5,0.46));
  return (ms.length*0.5+0.7)*1000;
}
function deg(d,minor,root){const sc=minor?MOLL:DUR, o=Math.floor(d/7), i=((d%7)+7)%7; return root+sc[i]+12*o}
function playSong(song,minor,root=60,beat=0.36){
  stopAll(); const c=ac(); let t=c.currentTime+0.08;
  const tr=triad(root-12,minor);
  tr.forEach(m=>note(m,t,beat*3.5,0.13));
  song.notes.forEach(([d,b])=>{note(deg(d,minor,root),t,beat*b*0.92,0.3); t+=beat*b});
  triad(root-12,minor).forEach(m=>note(m,t,1.5,0.18)); note(root,t,1.5,0.2);
  return (t-c.currentTime+1.6)*1000;
}

// ---------- Musik-Daten (alles gemeinfreie Volkslieder / Klassik) ----------
const SONGS=[
 {name:'Alle meine Entchen',notes:[[0,1],[1,1],[2,1],[3,1],[4,2],[4,2],[5,1],[5,1],[5,1],[5,1],[4,4],[5,1],[5,1],[5,1],[5,1],[4,4],[3,1],[3,1],[3,1],[3,1],[2,2],[2,2],[1,1],[1,1],[1,1],[1,1],[0,4]]},
 {name:'Bruder Jakob',notes:[[0,1],[1,1],[2,1],[0,1],[0,1],[1,1],[2,1],[0,1],[2,1],[3,1],[4,2],[2,1],[3,1],[4,2],[4,.5],[5,.5],[4,.5],[3,.5],[2,1],[0,1],[4,.5],[5,.5],[4,.5],[3,.5],[2,1],[0,1],[0,1],[-3,1],[0,2],[0,1],[-3,1],[0,2]]},
 {name:'Hänschen klein',notes:[[4,1],[2,1],[2,2],[3,1],[1,1],[1,2],[0,1],[1,1],[2,1],[3,1],[4,1],[4,1],[4,2],[4,1],[2,1],[2,2],[3,1],[1,1],[1,2],[0,1],[2,1],[4,1],[4,1],[0,4]]},
 {name:'Morgen kommt der Weihnachtsmann',notes:[[0,1],[0,1],[4,1],[4,1],[5,1],[5,1],[4,2],[3,1],[3,1],[2,1],[2,1],[1,1],[1,1],[0,2],[4,1],[4,1],[3,1],[3,1],[2,1],[2,1],[1,2]]},
 {name:'Ode an die Freude (Beethoven)',notes:[[2,1],[2,1],[3,1],[4,1],[4,1],[3,1],[2,1],[1,1],[0,1],[0,1],[1,1],[2,1],[2,1.5],[1,.5],[1,2],[2,1],[2,1],[3,1],[4,1],[4,1],[3,1],[2,1],[1,1],[0,1],[0,1],[1,1],[2,1],[1,1.5],[0,.5],[0,2]]}
];
const NAMES_MAJ=['C','Des','D','Es','E','F','Fis','G','As','A','B','H'];
const NAMES_MIN=['c','cis','d','es','e','f','fis','g','gis','a','b','h'];
const keyName=(root,minor)=>minor?NAMES_MIN[root%12]+'-Moll':NAMES_MAJ[root%12]+'-Dur';
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function modes(n){const h=Math.ceil(n/2);return shuffle([...Array(h).fill(false),...Array(n-h).fill(true)])}

// ---------- Runden ----------
const ROUNDS=[
 {id:'akkord',title:'Runde 1: Akkord-Detektive',min:7,pts:1,
  how:'Hört den Akkord genau an. Jedes Team berät sich leise. Auf <b>„3 – 2 – 1“</b> zeigt euer Team-Kapitän: <b>Daumen hoch 👍 = Dur</b> · <b>Daumen runter 👎 = Moll</b>.',
  tip:'8 Akkorde · 1 Punkt pro richtiger Antwort. Akkord darf 2× gespielt werden.',
  make:()=>modes(8).map(m=>({minor:m,root:rnd(57,67)}))},
 {id:'zwilling',title:'Runde 2: Lieder-Zwillinge',min:7,pts:2,
  how:'Ihr hört ein bekanntes Lied zweimal: <b>Version A</b> und <b>Version B</b>. Eine Version ist in <b>Moll</b>. Welche? Zeigt <b>1 Finger = A</b> oder <b>2 Finger = B</b>.',
  tip:'5 Lieder · 2 Punkte. Frage nach dem Auflösen: „Wie hat sich die Moll-Version angefühlt?“',
  make:()=>shuffle(SONGS).map(s=>({song:s,mollIs:Math.random()<.5?'A':'B'}))},
 {id:'freeze',title:'Runde 3: Freeze-Tanz',min:5,pts:1,
  how:'Alle stehen auf! Klingt die Musik nach <b>Dur</b>: <b>tanzt</b> 💃. Klingt sie nach <b>Moll</b>: werdet zur <b>Statue</b> 🗿. Bleibt so, bis die Musik aufhört!',
  tip:'6 Lieder · keine Pflichtpunkte. Optional +1 für das Team, das am besten reagiert hat. Ruhig mit Stopp-Pausen spielen.',
  make:()=>modes(6).map(m=>({minor:m,song:SONGS[rnd(0,SONGS.length-1)],root:rnd(58,64)}))},
 {id:'treppe',title:'Runde 4: Tonleiter-Treppe',min:5,pts:1,
  how:'Ihr hört eine Tonleiter: 8 Töne von unten nach oben. Ist es eine <b>Dur</b>- oder eine <b>Moll</b>-Tonleiter? Tipp: Achtet besonders auf den <b>3. Ton</b>!',
  tip:'6 Tonleitern · 1 Punkt. Nach dem Auflösen zeigt die Treppe, wo die Halbtonschritte (H) liegen.',
  make:()=>modes(6).map(m=>({minor:m,root:rnd(57,65)}))},
 {id:'blitz',title:'Runde 5: Blitz-Finale ⚡',min:5,pts:2,
  how:'Jetzt wird es schnell! Nach dem Akkord habt ihr nur <b>5 Sekunden</b>. Dann zeigen alle Kapitäne gleichzeitig: 👍 Dur oder 👎 Moll. <b>Doppelte Punkte!</b>',
  tip:'10 Akkorde · 2 Punkte · nur 1× hören.',
  make:()=>modes(10).map(m=>({minor:m,root:rnd(55,69)}))}
];

// ---------- Zustand ----------
const COLORS=['#D9541E','#6A4BB5','#0F7B6C','#C2368A'];
const DEFAULT=['Team Sonne','Team Mond','Team Stern','Team Blitz'];
let S={screen:'home',nTeams:4,teams:[],r:0,i:0,items:[],revealed:false,awarded:{},done:[]};

// ---------- Tastatur ----------
const KB_LO=53,KB_HI=79;
function keyboardSVG(){
  const isBlack=m=>[1,3,6,8,10].includes(m%12);
  const whites=[];for(let m=KB_LO;m<=KB_HI;m++) if(!isBlack(m)) whites.push(m);
  const W=40,H=150,w=whites.length*W;
  let s=`<svg class="kb" viewBox="0 0 ${w} ${H+2}" role="img" aria-label="Klaviatur: Gespielte Töne leuchten auf">`;
  whites.forEach((m,i)=>{s+=`<rect data-m="${m}" data-base="#ffffff" x="${i*W+1}" y="1" width="${W-2}" height="${H}" rx="6" fill="#ffffff" stroke="#2b2633" stroke-width="2"/>`;
    if(m%12===0) s+=`<text x="${i*W+W/2}" y="${H-12}" text-anchor="middle" font-size="16" font-family="Nunito" font-weight="800" fill="#6b6475">C</text>`});
  for(let m=KB_LO;m<=KB_HI;m++) if(isBlack(m)){const idx=whites.indexOf(m-1);
    s+=`<rect data-m="${m}" data-base="#2b2633" x="${(idx+1)*W-13}" y="1" width="26" height="${H*0.62}" rx="4" fill="#2b2633"/>`}
  return s+'</svg>';
}
function light(m,on){
  const el=document.querySelector(`.kb rect[data-m="${m}"]`); if(!el) return;
  el.setAttribute('fill',on?'#F2A516':el.dataset.base);
}

// ---------- Rendering ----------
const app=document.getElementById('app');
function chips(){
  const c=document.getElementById('chips');
  if(!KL.includes(S.screen)||S.screen==='start'){c.innerHTML='';return}
  c.innerHTML=ROUNDS.map((r,k)=>`<button class="chip ${S.screen==='round'&&S.r===k?'on':''} ${S.done.includes(k)?'done':''}" data-jump="${k}">${k+1}. ${r.title.split(': ')[1]}</button>`).join('')
   +`<button class="chip ${S.screen==='end'?'on':''}" data-end="1">🏆 Sieger</button>`;
  c.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>startRound(+b.dataset.jump));
  c.querySelector('[data-end]').onclick=()=>{stopAll();S.screen='end';render()};
}
function teamsBar(){
  const el=document.getElementById('teams');
  if(!KL.includes(S.screen)||S.screen==='start'||S.fromTeacher){el.innerHTML='';return}
  el.style.gridTemplateColumns=`repeat(${S.teams.length},minmax(0,1fr))`;
  const r=ROUNDS[S.r], key=S.r+'-'+S.i, canAward=S.screen==='round'&&S.revealed&&S.phase==='item';
  const lab=r.id==='freeze'?`+${r.pts} super reagiert`:`✓ richtig (+${r.pts})`;
  el.innerHTML=S.teams.map((t,k)=>`<div class="team" style="background:${t.color}">
     <div class="nm">${esc(t.name)}</div><div class="sc" aria-live="polite">${t.score}</div>
     ${canAward?`<button class="ok ${(S.awarded[key]||[]).includes(k)?'on':''}" data-aw="${k}">${lab}</button>`:''}
     <div class="adj"><button data-adj="${k}" data-d="-1" aria-label="Punkt abziehen">−</button><button data-adj="${k}" data-d="1" aria-label="Punkt dazu">+</button></div></div>`).join('');
  el.querySelectorAll('[data-aw]').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.aw, a=S.awarded[key]||(S.awarded[key]=[]);
    if(a.includes(k)){a.splice(a.indexOf(k),1);S.teams[k].score-=r.pts}else{a.push(k);S.teams[k].score+=r.pts}
    teamsBar();});
  el.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>{S.teams[+b.dataset.adj].score=Math.max(0,S.teams[+b.dataset.adj].score+ +b.dataset.d);teamsBar()});
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KL=['start','round','end'];
function render(){
  chips();
  document.getElementById('chips').classList.toggle('hide',!KL.includes(S.screen)||S.fromTeacher);
  if(S.screen==='home') renderHome();
  else if(S.screen==='solo') renderSoloStart();
  else if(S.screen==='teacher') renderTeacher();
  else if(S.screen==='start') renderStart();
  else if(S.screen==='round') S.phase==='intro'?renderIntro():S.phase==='outro'?renderOutro():renderItem();
  else renderEnd();
  teamsBar();
}

function renderStart(){
  app.innerHTML=`<div class="card start" style="display:flex;flex-direction:column;gap:16px">
    <h1 class="title">Dur-Moll-Spielshow 🎵</h1>
    <div class="how">5 Runden · ca. 30 Minuten · Ihr spielt in Teams gegeneinander. Ihr braucht nur eure Ohren und eure Daumen!</div>
    <div class="legend"><span style="color:var(--dur)">👍 ☀️ Dur = oft hell, fröhlich</span><span style="color:var(--moll)">👎 🌧️ Moll = oft dunkel, traurig</span></div>
    <div><label>Wie viele Teams?</label><div class="row seg" style="justify-content:flex-start;margin-top:6px">
      ${[2,3,4].map(n=>`<button data-n="${n}" class="${S.nTeams===n?'on':''}">${n}</button>`).join('')}</div></div>
    <div class="grid2">${Array.from({length:S.nTeams},(_,k)=>`<div><label for="tn${k}" style="color:${COLORS[k]}">Team ${k+1}</label>
      <input id="tn${k}" value="${esc((S.teams[k]&&S.teams[k].name)||DEFAULT[k])}" maxlength="22"></div>`).join('')}</div>
    <div class="row" style="justify-content:flex-start">
      <button class="play ghost" id="test">🔊 Ton-Test</button>
      <button class="next" id="go" style="font-size:26px;padding:16px 34px">Los geht's! ▶</button></div>
    <div class="teach"><b>Für die Lehrkraft:</b> Laptop an die Lautsprecher anschließen und erst den Ton-Test machen. Teams mit 4–6 Kindern bilden, jedes Team wählt eine/n Kapitän/in, der/die die Antwort zeigt. Kein Handy und kein Tablet nötig. Die Musik spielt die Seite selbst – ihr müsst kein Instrument spielen. Nach jeder Frage: <b>Auflösen</b> drücken, dann bei den Teams auf <b>✓ richtig</b> tippen. Mit + und − könnt ihr Punkte korrigieren.<br>
    <b>Ablauf:</b> ${ROUNDS.map(r=>`${r.title.split(':')[1].trim()} (${r.min} Min.)`).join(' · ')} · Siegerehrung (1 Min.)</div>
  </div>`;
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{saveNames();S.nTeams=+b.dataset.n;render()});
  document.getElementById('test').onclick=()=>playChord(60,false);
  document.getElementById('go').onclick=()=>{saveNames();S.teams=S.teams.slice(0,S.nTeams);startRound(0)};
}
function saveNames(){
  for(let k=0;k<S.nTeams;k++){const v=document.getElementById('tn'+k);const name=(v&&v.value.trim())||DEFAULT[k];
    if(!S.teams[k]) S.teams[k]={name,color:COLORS[k],score:0}; else S.teams[k].name=name;}
}
function startRound(k){stopAll();S.screen='round';S.r=k;S.i=0;S.items=ROUNDS[k].make();S.revealed=false;S.phase='intro';render()}

function renderIntro(){
  const r=ROUNDS[S.r];
  app.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:16px">
    <div class="counter">Runde ${S.r+1} von ${ROUNDS.length} · ca. ${r.min} Minuten</div>
    <h2 class="title">${r.title}</h2><div class="how">${r.how}</div>
    <div class="teach"><b>Für die Lehrkraft:</b> ${r.tip}</div>
    <div class="row"><button class="next" id="go">Erste Frage ▶</button></div></div>`;
  document.getElementById('go').onclick=()=>{S.phase='item';render()};
}
function renderOutro(){
  const last=S.r===ROUNDS.length-1;
  app.innerHTML=`<div class="card" style="text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center">

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function smodes(R,n){const h=Math.ceil(n/2);return sshuffle(R,[...Array(h).fill(false),...Array(n-h).fill(true)])}

function makeQuiz(seed,practice){
  const R=rng(seed), qs=[];
  const nc=practice?2:5, ns=practice?1:3, nl=practice?1:3, nk=practice?2:4;
  smodes(R,nc).forEach(m=>{const root=sr(R,55,67);qs.push({type:'chord',minor:m,root,a:m?1:0,o:['Dur ☀️','Moll 🌧️'],q:'Hör dir den Akkord an. Klingt er nach Dur oder nach Moll?',ex:`Das war ein ${keyName(root,m)}-Akkord.`})});
  sshuffle(R,SONGS).slice(0,ns).forEach(s=>{const mollA=R()<.5;qs.push({type:'song',song:s,mollA,a:mollA?0:1,o:['Version A','Version B'],q:`„${s.name}“ kommt zweimal. Welche Version ist in Moll?`,ex:`Version ${mollA?'A':'B'} war Moll, Version ${mollA?'B':'A'} war Dur.`})});
  smodes(R,nl).forEach(m=>{const root=sr(R,57,65);qs.push({type:'scale',minor:m,root,a:m?1:0,o:['Dur-Tonleiter ☀️','Moll-Tonleiter 🌧️'],q:'Hör dir die Tonleiter an. Ist sie Dur oder Moll? Tipp: Achte auf den 3. Ton.',ex:m?'Moll: G H G G H G G – der 3. Ton ist tiefer.':'Dur: G G H G G G H.'})});
  sshuffle(R,KNOW).slice(0,nk).forEach(k=>qs.push({type:'know',...k}));
  // gemischte Reihenfolge, aber nie mit Wissensfrage enden
  let out=sshuffle(R,qs); if(out[out.length-1].type==='know'){const j=out.findIndex(x=>x.type!=='know');[out[j],out[out.length-1]]=[out[out.length-1],out[j]]}
  return out;
}
function playQ(q){

    return a+300+songLen(q.song,0.3);

     <div style="display:flex;flex-direction:column;gap:10px">
       <div class="how">Heute spielt jedes Kind <b>allein auf seinem Tablet</b> (mit Kopfhörern) ein Hör-Turnier zu Dur und Moll. Die Seite spielt die Töne selbst und kontrolliert die Antworten. Keine Vorkenntnisse nötig.</div>
       <div class="row" style="justify-content:flex-start;gap:16px"><span style="font-weight:800;font-size:20px">Spielcode für die Tafel:</span>
         <div class="row seg" style="justify-content:flex-start">${Object.keys(SETS).map(k=>`<button data-ts="${k}" class="${TSET===k?'on':''}">${k}</button>`).join('')}</div>
         <span class="big" style="font-size:72px;font-weight:700;color:var(--kunst);line-height:1">${TSET}</span></div>
       <div class="small">Mit demselben Code bekommen alle Kinder dieselben Fragen in derselben Reihenfolge. Für eine zweite Runde einfach einen neuen Buchstaben an die Tafel schreiben.</div>
     </div></div>
   <div class="teach"><b>Ablauf (ca. 30 Minuten):</b><br>
     1. <b>5 Min.</b> Tablets und Kopfhörer verteilen, QR-Code scannen, auf <b>„Einzel-Turnier“</b> tippen. Regel: <b>nur Tablets, keine Handys</b>, nur den <b>eigenen Vornamen</b> eingeben.<br>
     2. <b>3 Min.</b> Übungsrunde (6 Fragen, zählt nicht).<br>
     3. <b>10 Min.</b> Turnier mit Spielcode an der Tafel (15 Fragen).<br>
     4. <b>4 Min.</b> Kinder zeigen ihre Ergebnis-Karte. Die besten 5 unten eintragen (der Prüfcode zeigt, ob die Punktzahl echt ist).<br>
     5. <b>8 Min.</b> Siegerehrung, dann zweite Turnierrunde mit neuem Spielcode, wenn noch Zeit ist.<br>
     <b>Ohne Kopfhörer?</b> Dann lieber zusammen die <b>Klassen-Spielshow</b> (Startseite) am Smartboard in Teams spielen.</div>
   <div style="display:flex;flex-direction:column;gap:10px">
     <h3 style="margin:0;font-size:26px;color:var(--musik)">Bestenliste</h3>
     <form id="addf" class="row" style="justify-content:flex-start">
       <input id="bn" placeholder="Vorname" maxlength="16" style="font:inherit;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:10px;width:170px">
       <input id="bs" placeholder="Punkte" inputmode="numeric" style="font:inherit;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:10px;width:120px">
       <input id="bc" placeholder="Prüfcode" maxlength="4" style="font:inherit;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:10px;width:120px;text-transform:uppercase">
       <button class="next" type="submit" style="font-size:18px;padding:10px 18px">Eintragen</button>
       <span id="bmsg" class="small" style="font-weight:800" aria-live="polite"></span></form>
     <table style="width:100%;border-collapse:collapse;font-size:20px">${sorted.map((r,k)=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:6px;width:50px;font-weight:800">${k+1}.</td><td>${esc(r.name)}</td><td style="font-weight:800;color:var(--musik)">${r.score}</td><td class="small">Code ${r.set} ${r.ok?'✅':'⚠️ Prüfcode passt nicht'}</td><td><button data-del="${BL.indexOf(r)}" class="play ghost" style="font-size:14px;padding:4px 10px" aria-label="Löschen">✕</button></td></tr>`).join('')||'<tr><td class="small">Noch keine Einträge.</td></tr>'}</table>
     <div class="row" style="justify-content:flex-start"><button class="play" id="pod">🏆 Siegerehrung zeigen</button><button class="play ghost" id="clr">Liste leeren</button></div>
   </div></div>`;
  app.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{TSET=b.dataset.ts;renderTeacher()});
  document.getElementById('addf').onsubmit=e=>{e.preventDefault();
    const name=document.getElementById('bn').value.trim(), score=parseInt(document.getElementById('bs').value,10), code=document.getElementById('bc').value.trim().toUpperCase();
    if(!name||isNaN(score)){document.getElementById('bmsg').textContent='Name und Punkte eingeben.';return}
    const ok=Object.keys(SETS).some(s=>checkCode(name,score,s)===code);
    const set=Object.keys(SETS).find(s=>checkCode(name,score,s)===code)||TSET;
    BL.push({name,score,set,ok});saveBL();renderTeacher();};
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{BL.splice(+b.dataset.del,1);saveBL();renderTeacher()});
  document.getElementById('clr').onclick=()=>{if(!BL.length)return;BL=[];saveBL();renderTeacher()};
  document.getElementById('pod').onclick=()=>{if(!BL.length)return;
    S.teams=[...BL].filter(r=>r.ok).sort((a,b)=>b.score-a.score).slice(0,5).map((r,k)=>({name:r.name,score:r.score,color:COLORS[k%4]}));
    if(!S.teams.length)return; S.screen='end'; S.fromTeacher=true; render()};
}
function renderHome(){
  stopAll();
  app.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:18px">
   <h1 class="title">Dur-Moll-Spiele 🎵</h1>
   <div class="grid2">
     <button class="play" id="h1" style="flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:22px;font-size:26px">🎧 Einzel-Turnier<span style="font-size:16px;font-weight:700">Für Schüler/innen: jeder auf seinem Tablet, mit Punkten wie bei Kahoot</span></button>
     <button class="play alt" id="h2" style="flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:22px;font-size:26px">👩‍🏫 Lehrkraft / Vertretung<span style="font-size:16px;font-weight:700">Spielcode, QR-Code, Ablauf und Bestenliste</span></button>
     <button class="play ghost" id="h3" style="flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:22px;font-size:26px">🏟️ Klassen-Spielshow<span style="font-size:16px;font-weight:700">Alle zusammen am Smartboard, in Teams</span></button>
   </div></div>`;
  document.getElementById('h1').onclick=()=>go('turnier');
  document.getElementById('h2').onclick=()=>go('lehrkraft');
  document.getElementById('h3').onclick=()=>go('klasse');
}
function go(h){ if(location.hash.replace('#','')!==h) location.hash=h; else route(); }
function route(){
  const h=location.hash.replace('#','');
  stopAll(); clearInterval(soTick);
  if(h==='turnier'){S.screen='solo';}
  else if(h==='lehrkraft'){S.screen='teacher';}
  else if(h==='klasse'){S.screen='start';}
  else S.screen='home';
  render();
}
window.addEventListener('hashchange',route);

document.getElementById('home').onclick=()=>go('');
route();
</script>

<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funktion oder nicht – Mathe 9G</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--blue:#164A9C;--dark:#0E2F66;--lblue:#1C69D4;--tint:#EAF0FA;--orange:#E8833A;--odark:#B4561A;--otint:#FFF1E4;--red:#E2231A;--ink:#1B1F24;--grey:#4A5562;--line:#D5E3E7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F4F6FA;color:var(--ink);font-family:'Lexend',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,.t1,.verdict,.who,.ans .k,.team b,.qn,.mode b{font-family:'Fredoka',system-ui,sans-serif;font-weight:600}
#app{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;background:var(--dark);color:#fff;padding:10px 18px;flex-wrap:wrap}
.ava{width:46px;height:46px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.tt{flex:1 1 220px;min-width:0}.t1{font-size:22px}.t2{font-size:13px;color:#C9D8F0}
.icon{background:transparent;border:1.5px solid #9DB3DA;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;min-height:44px}
.stripe{height:5px;background:linear-gradient(90deg,var(--lblue) 0 33.3%,var(--dark) 33.3% 66.6%,var(--red) 66.6%)}
.score{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.team{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding:4px 16px;min-width:110px;background:rgba(255,255,255,.12);border:2px solid transparent}
.team span{font-size:12px;opacity:.9}.team b{font-size:24px;line-height:1.1}
.team.blue{background:var(--lblue)}.team.orange{background:var(--orange);color:var(--ink)}.team.grey{background:#6B7684;color:#fff}
.team.act{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.score .team:not(.act){opacity:.65}
.qn{font-size:18px;padding:0 6px}
main{flex:1;padding:22px clamp(14px,3vw,40px);position:relative;max-width:1280px;width:100%;margin:0 auto}
.start .hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.pose.big{height:210px}
h1{font-size:clamp(28px,4vw,44px);color:var(--dark);margin:0 0 8px}
.lead{font-size:19px;color:var(--grey);max-width:720px;margin:0;line-height:1.45}
h2{color:var(--blue);font-size:22px;margin:26px 0 12px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 22px;font-size:19px;min-height:60px;display:flex;gap:12px;align-items:center}
.opt .dots{color:var(--blue);letter-spacing:3px}
.opt.on{border-color:var(--blue);background:var(--tint);box-shadow:0 0 0 3px rgba(22,74,156,.15)}
.mode{flex:1 1 300px;text-align:left;background:#fff;border:2px solid var(--blue);border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;gap:6px;min-height:96px}
.mode b{font-size:24px;color:var(--dark)}.mode span{color:var(--grey);font-size:16px}
.mode:hover,.opt:hover{transform:translateY(-1px)}
.timebar{height:10px;background:#DCE4F0;border-radius:6px;overflow:hidden;margin-bottom:14px}
.timebar i{display:block;height:100%;width:100%;background:var(--lblue);transition:width .1s linear}
.timebar i.low{background:var(--red)}
.who{display:inline-block;border-radius:10px;padding:4px 14px;font-size:18px;margin-bottom:12px;color:#fff}
.who.blue{background:var(--lblue)}.who.orange{background:var(--orange);color:var(--ink)}
.qwrap{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px 24px;margin-bottom:18px}
.qtext{flex:1 1 360px;font-size:clamp(21px,2.4vw,28px);line-height:1.45}
.qtext small{display:block;font-size:.7em;color:var(--grey);margin-top:6px}
.visual{flex:0 1 auto}.visual svg{display:block;max-width:100%;height:auto}
.visual.small svg{max-height:260px;width:auto}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-right:150px}
.ans{background:#fff;border:2.5px solid var(--blue);border-radius:16px;padding:16px 18px;font-size:clamp(20px,2.3vw,27px);min-height:76px;text-align:left;display:flex;align-items:center;gap:14px}
.ans .k{flex:0 0 36px;height:36px;border-radius:9px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.ans:hover:not(:disabled){background:var(--tint)}
.ans.right{background:#E6F0FF;border-color:var(--lblue);box-shadow:0 0 0 4px rgba(28,105,212,.25)}
.ans.right .k{background:var(--lblue)}
.ans.wrong{background:#FDECEC;border-color:var(--red)}.ans.wrong .k{background:var(--red)}
.ans:disabled{cursor:default}
.pose.corner{position:absolute;right:clamp(10px,3vw,40px);bottom:10px;height:150px;pointer-events:none}
.fb{position:fixed;inset:0;background:rgba(14,47,102,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.fb[hidden]{display:none}
.card{background:#fff;border-radius:20px;max-width:860px;width:100%;display:flex;gap:20px;padding:22px 26px;border:4px solid var(--blue);align-items:flex-start;max-height:92vh;overflow:auto}
.card.no{border-color:var(--orange)}
.fbp{height:170px;flex:0 0 auto}
.fbc{flex:1;min-width:0}
.verdict{font-size:32px;color:var(--dark)}.card.no .verdict{color:var(--odark)}
.pts{font-family:'Fredoka',sans-serif;font-size:20px;color:var(--lblue);margin-top:2px}
.expl{font-size:20px;line-height:1.5;margin:10px 0 14px}
.next{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:14px 30px;font-size:21px;min-height:56px;margin-top:6px}
.end{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.final{display:flex;gap:16px;margin:16px 0 26px;flex-wrap:wrap}
.final .team{min-width:170px;padding:10px 20px;color:#fff}.final .team.orange{color:var(--ink)}
.final .team b{font-size:42px}
.machine{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
table.wt{border-collapse:collapse;font-size:22px}
table.wt td,table.wt th{border:2px solid var(--grey);padding:6px 14px;text-align:center;min-width:52px}
table.wt th{background:var(--tint);color:var(--dark)}
.eq{font-family:'Fredoka',sans-serif;color:var(--dark);font-size:1.1em;white-space:nowrap}
@media (max-width:760px){.answers{grid-template-columns:1fr;padding-right:0}.pose.corner{display:none}.card{flex-direction:column;align-items:center}.fbp{height:110px}}
.sol{font-size:21px;margin-top:6px}.sol b{color:var(--blue)}
</style></head>

<script>/* Gemeinsame Hilfen fuer die Fragen-Generatoren (auch in Node testbar). */
var U = (function () {
  "use strict";
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const round = (x, d) => { const f = Math.pow(10, d == null ? 6 : d); return Math.round(x * f) / f; };
  // Zahl auf Deutsch: Komma, Tausenderpunkt als schmales Leerzeichen, Minus als echtes Minus
  function de(x, d) {
    x = round(x, d == null ? 4 : d);
    const neg = x < 0; let s = Math.abs(x).toString();
    if (s.indexOf("e") >= 0) s = Math.abs(x).toFixed(8).replace(/0+$/, "").replace(/\.$/, "");
    let [i, f] = s.split(".");
    if (i.length > 3) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "−" : "") + i + (f ? "," + f : "");
  }
  const eur = (x) => (x < 0 ? "−" : "") + Math.abs(round(x, 2)).toFixed(2).replace(".", ",") + " €";
  const ct = (x) => de(x, 2) + " ct";
  // Antworten: richtige + Ablenker, ohne Doppelte; fuellt mit Ausweichwerten auf
  function choices(correct, distract, fill, n) {
    n = n || 4; const out = [correct];
    for (const d of distract.concat(fill || [])) { if (out.length >= n) break; if (out.indexOf(d) < 0) out.push(d); }
    return { choices: out, correct: 0 };
  }
  // Term-Darstellung y = ax + b
  function term(a, b, v) {
    v = v || "x"; let s;
    if (a === 0) return de(b);
    if (a === 1) s = v; else if (a === -1) s = "−" + v; else s = de(a) + v;
    if (b > 0) s += " + " + de(b); else if (b < 0) s += " − " + de(-b);
    return s;
  }
  return { pick, rint, round, de, eur, ct, choices, term };
})();
if (typeof module !== "undefined") module.exports = U;
</script>

  const BLUE = "#164A9C", OR = "#E8833A", RED = "#E2231A";

    for (let i = -R; i <= R; i++) {

    for (const i of [-4, -2, 2, 4]) {

  const svg = (inner, label) => `<svg viewBox="0 0 ${SZ} ${SZ}" width="${SZ}" height="${SZ}" role="img" aria-label="${label}">${grid()}${inner}</svg>`;
  const path = (pts, col) => `<polyline fill="none" stroke="${col || BLUE}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${pts.filter(p => Math.abs(p[0]) <= R + .01 && Math.abs(p[1]) <= R + .01).map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ")}"/>`;
  const crosses = (pts, col) => pts.map(([x, y]) => `<g stroke="${col || BLUE}" stroke-width="3.5" stroke-linecap="round"><line x1="${X(x) - 7}" y1="${Y(y) - 7}" x2="${X(x) + 7}" y2="${Y(y) + 7}"/><line x1="${X(x) - 7}" y1="${Y(y) + 7}" x2="${X(x) + 7}" y2="${Y(y) - 7}"/></g>`).join("");
  const range = (a, b, n) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);
  function vline(x, hits) {
    return `<line x1="${X(x)}" y1="${Y(R)}" x2="${X(x)}" y2="${Y(-R)}" stroke="${OR}" stroke-width="3" stroke-dasharray="8 6"/>` +
      hits.map(y => `<circle cx="${X(x)}" cy="${Y(y)}" r="9" fill="${RED}" stroke="#fff" stroke-width="2"/>`).join("");
  }
  const sweep = `<line y1="${Y(R)}" y2="${Y(-R)}" stroke="${OR}" stroke-width="3" stroke-dasharray="8 6"><animate attributeName="x1" from="${X(-R)}" to="${X(R)}" dur="2.4s" repeatCount="indefinite"/><animate attributeName="x2" from="${X(-R)}" to="${X(R)}" dur="2.4s" repeatCount="indefinite"/></line>`;

  // ----- Formen: {draw, fn:true/false, bad:{x,hits}} -----
  function line() { const m = pick([-2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2]), b = rint(-2, 2);
    return { draw: path(range(-R, R, 2).map(x => [x, m * x + b])), fn: true, name: "Gerade" }; }
  function parabola() { const a = pick([0.5, 1, -0.5, -1]), h = rint(-2, 2), k = rint(-3, 2);
    return { draw: path(range(-R, R, 80).map(x => [x, a * (x - h) ** 2 + k])), fn: true, name: "Parabel" }; }
  function absV() { const h = rint(-2, 2), k = rint(-3, 0);
    return { draw: path(range(-R, R, 2).concat([h]).sort((p, q) => p - q).map(x => [x, Math.abs(x - h) + k])), fn: true, name: "V-Form" }; }
  function horiz() { const b = pick([-3, -2, 2, 3, 1]);
    return { draw: path([[-R, b], [R, b]]), fn: true, name: "waagerechte Gerade", note: "Eine waagerechte Gerade ist eine Funktion (konstante Funktion): Jedes x hat genau einen y-Wert." }; }
  function zigzag() { const ys = [rint(-3, 3), rint(-3, 3), rint(-3, 3), rint(-3, 3), rint(-3, 3)];
    return { draw: path([-4, -2, 0, 2, 4].map((x, i) => [x, ys[i]])), fn: true, name: "Zickzack" }; }
  function wave() { return { draw: path(range(-R, R, 120).map(x => [x, 2.5 * Math.sin(x)])), fn: true, name: "Welle" }; }
  function circle() { const cx = rint(-1, 1), cy = rint(-1, 1), r = pick([2, 3]);
    return { draw: path(range(0, 2 * Math.PI, 120).map(t => [cx + r * Math.cos(t), cy + r * Math.sin(t)])), fn: false,
      bad: { x: cx, hits: [cy + r, cy - r] }, name: "Kreis" }; }
  function ellipse() { const rx = 3.5, ry = 2;
    return { draw: path(range(0, 2 * Math.PI, 120).map(t => [rx * Math.cos(t), ry * Math.sin(t)])), fn: false,
      bad: { x: 0, hits: [ry, -ry] }, name: "Ellipse" }; }
  function vertical() { const c = pick([-3, -2, 2, 3, 1]);
    return { draw: path([[c, -R], [c, R]]), fn: false, bad: { x: c, hits: [-2, 0, 2] }, name: "senkrechte Gerade",
      note: `Bei x = ${de(c)} liegen unendlich viele Punkte übereinander.` }; }
  function sideways() { const a = pick([0.5, 1]), c = rint(-3, -1), s = pick([1, -1]);
    return { draw: path(range(-R, R, 80).map(y => [s * (a * y * y) + c, y])), fn: false,
      bad: { x: c + s * a * 4, hits: [2, -2] }, name: "liegende Parabel" }; }
  function sCurve() {
    return { draw: path(range(-2.4, 2.4, 120).map(y => [y ** 3 - 3 * y, y])), fn: false,
      bad: { x: 0, hits: [0, Math.sqrt(3), -Math.sqrt(3)] }, name: "S-Kurve" }; }
  function jump() { const j = rint(-1, 2), a = rint(-3, -1), b = rint(1, 3);
    return { draw: path([[-R, a], [j, a], [j, b], [R, b]]), fn: false, bad: { x: j, hits: [a, b] }, name: "Treppe mit senkrechtem Stück",
      note: `Das senkrechte Stück bei x = ${de(j)} enthält viele Punkte übereinander.` }; }
  function points(fn) {
    const xs = [-4, -3, -2, -1, 0, 1, 2, 3, 4].sort(() => Math.random() - .5).slice(0, rint(5, 7)).sort((a, b) => a - b);
    const pts = xs.map(x => [x, rint(-3, 3)]);
    let bad = null;
    if (!fn) { const p = pick(pts); let y2; do { y2 = rint(-4, 4); } while (y2 === p[1]); pts.push([p[0], y2]); bad = { x: p[0], hits: [p[1], y2] }; }
    return { draw: crosses(pts), fn, bad, pts, name: "Punkte" };
  }

  const set = (a) => "{" + Array.from(new Set(a)).sort((p, q) => p - q).map(v => de(v)).join("; ") + "}";

  function fnQuestion(shape, key) {
    const label = "Graph im Koordinatensystem";
    let reveal, explain;
    if (shape.fn) {
      reveal = svg(shape.draw + sweep, label);
      explain = (shape.note || "Jede senkrechte Linie trifft den Graphen höchstens einmal.") + " Also ist es ein <b>Funktionsgraph</b>.";
    } else {
      reveal = svg(shape.draw + vline(shape.bad.x, shape.bad.hits), label);
      explain = (shape.note || `Bei x = ${de(shape.bad.x)} trifft die senkrechte Linie ${shape.bad.hits.length} Punkte.`) + " Also ist es <b>kein</b> Funktionsgraph.";
    }
    return { key, prompt: "Ist das ein Funktionsgraph?<small>Denk an den Senkrechtentest.</small>", visual: svg(shape.draw, label),
      choices: ["Funktion", "keine Funktion"], correct: shape.fn ? 0 : 1, explain, reveal };
  }
  function dwQuestion() {
    const s = points(true), xs = s.pts.map(p => p[0]), ys = s.pts.map(p => p[1]);
    const askW = Math.random() < .6;
    const right = askW ? set(ys) : set(xs), other = askW ? set(xs) : set(ys);
    const extra = set((askW ? ys : xs).concat([pick([-5, 5])]));
    const miss = set((askW ? ys : xs).slice(1));
    const c = U.choices(right, [other, extra, miss], [set([0, 1, 2]), set([-1, 0, 1, 3]), set([-2, 2, 3])]);
    return Object.assign(c, { key: "dw" + JSON.stringify(s.pts) + askW, visual: svg(s.draw, "Punkte im Koordinatensystem"),
      prompt: askW ? "Gib die <b>Wertemenge W</b> an.<small>W: alle y-Werte der Punkte</small>" : "Gib die <b>Definitionsmenge D</b> an.<small>D: alle x-Werte der Punkte</small>",
      explain: askW ? `Die y-Werte der Punkte sind ${right}. Jeder Wert steht nur einmal in der Menge.` : `Die x-Werte der Punkte sind ${right}.` });
  }

  const L1 = [line, parabola, absV, circle, vertical, sideways];
  const L2 = [() => points(true), () => points(false), () => points(false), horiz, ellipse, wave, circle];
  const L3 = [sCurve, jump, zigzag, horiz, () => points(false), wave, sideways, ellipse];
  function gen(lv) {
    if (lv >= 2 && Math.random() < (lv === 2 ? .3 : .25)) return dwQuestion();
    const f = pick(lv === 1 ? L1 : lv === 2 ? L2 : L3); const s = f();
    return fnQuestion(s, s.name + Math.random().toFixed(3));
  }
  return { title: "Funktion oder nicht?", sub: "Lineare Funktionen · Senkrechtentest",
    intro: "Erkennst du auf einen Blick, ob ein Graph zu einer Funktion gehört? Nach jeder Antwort zeigt der Senkrechtentest, warum.",
    levels: ["Basis: Kurven", "Standard: Punkte, D und W", "Expert: knifflige Graphen"], gen };
})(typeof U !== "undefined" ? U : require("./util.js"));
if (typeof module !== "undefined") module.exports = GAME;
</script>
<script>/* Spiel-Engine (Herr Özdemir, Mathe 9G). Erwartet window.GAME = {title, sub, levels, gen(level, rnd)} und window.POSES. */
(function () {
  "use strict";

  // ---------- Hilfen ----------
  const $ = (s, r) => (r || document).querySelector(s);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const G = window.GAME, P = window.POSES;
  const TEAMS = [{ name: "Team Blau", cls: "blue" }, { name: "Team Orange", cls: "orange" }];
  const DUEL_Q = 12, DUEL_T = 40, BLITZ_T = 120;

  const st = { mode: "duel", level: 1, scores: [0, 0], turn: 0, qn: 0, seen: new Set(), timer: null, t: 0, tmax: 0,
    blitz: { right: 0, wrong: 0, streak: 0, best: 0 }, locked: false, sound: true, q: null };

  // ---------- Ton ----------
  let ac = null;
  function beep(ok) {
    if (!st.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const notes = ok ? [660, 880] : [300, 220];
      notes.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = ok ? "triangle" : "sawtooth"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ac.currentTime + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.12, ac.currentTime + i * 0.12 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * 0.12 + 0.18);
        o.connect(g).connect(ac.destination); o.start(ac.currentTime + i * 0.12); o.stop(ac.currentTime + i * 0.12 + 0.2);
      });
    } catch (e) { /* kein Ton moeglich */ }
  }

  // ---------- Bildschirme ----------
  const app = $("#app");

  function header(extra) {
    return `<header class="top"><img class="ava" src="${P.avatar}" alt="">
      <div class="tt"><div class="t1">${G.title}</div><div class="t2">Mathe 9G · ${G.sub}</div></div>
      ${extra || ""}
      <button class="icon" id="snd" aria-label="Ton an oder aus">${st.sound ? "Ton an" : "Ton aus"}</button>
      <button class="icon" id="fs" aria-label="Vollbild">Vollbild</button></header><div class="stripe"></div>`;
  }
  function wireHeader() {
    const s = $("#snd"); if (s) s.onclick = () => { st.sound = !st.sound; s.textContent = st.sound ? "Ton an" : "Ton aus"; };
    const f = $("#fs"); if (f) f.onclick = () => {
      try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    };
  }

  function startScreen() {
    stopTimer();
    app.innerHTML = header() + `
      <main class="start">
        <div class="hero">
          <img class="pose big" src="${P.winken}" alt="">
          <div>
            <h1>${G.title}</h1>
            <p class="lead">${G.intro}</p>
          </div>
        </div>
        <section class="pick">
          <h2>1. Niveau wählen</h2>
          <div class="row" id="lv">${G.levels.map((n, i) => `<button class="opt ${i === st.level - 1 ? "on" : ""}" data-l="${i + 1}">
            <span class="dots">${"●".repeat(i + 1)}${"○".repeat(2 - i)}</span>${n}</button>`).join("")}</div>
          <h2>2. Spielart wählen</h2>
          <div class="row">
            <button class="mode" data-m="duel"><b>Klassenduell</b><span>Team Blau gegen Team Orange, ${DUEL_Q} Fragen abwechselnd, je ${DUEL_T} Sekunden</span></button>
            <button class="mode" data-m="blitz"><b>Blitzrunde</b><span>${BLITZ_T} Sekunden, so viele richtige Antworten wie möglich</span></button>
          </div>
        </section>
      </main>`;
    wireHeader();
    app.querySelectorAll("#lv .opt").forEach(b => b.onclick = () => {
      st.level = +b.dataset.l; app.querySelectorAll("#lv .opt").forEach(x => x.classList.toggle("on", x === b));
    });
    app.querySelectorAll(".mode").forEach(b => b.onclick = () => begin(b.dataset.m));
  }

  function begin(mode) {
    st.mode = mode; st.scores = [0, 0]; st.turn = 0; st.qn = 0; st.seen.clear();
    st.blitz = { right: 0, wrong: 0, streak: 0, best: 0 };
    if (mode === "blitz") { st.tmax = BLITZ_T; st.t = BLITZ_T; }
    nextQuestion();
    if (mode === "blitz") startTimer();
  }

  function newQ() {
    for (let i = 0; i < 40; i++) {
      const q = G.gen(st.level);
      if (!st.seen.has(q.key)) { st.seen.add(q.key); return q; }
    }
    return G.gen(st.level);
  }

  function scoreBar() {
    if (st.mode === "duel") {
      return `<div class="score">
        ${TEAMS.map((t, i) => `<div class="team ${t.cls} ${i === st.turn ? "act" : ""}"><span>${t.name}</span><b>${st.scores[i]}</b></div>`).join("")}
        <div class="qn">Frage ${st.qn} / ${DUEL_Q}</div></div>`;
    }
    return `<div class="score"><div class="team blue act"><span>Richtig</span><b id="br">${st.blitz.right}</b></div>
      <div class="team orange"><span>Serie</span><b id="bs">${st.blitz.streak}</b></div><div class="qn" id="bt">${st.t} s</div></div>`;
  }

  function nextQuestion() {
    if (st.mode === "duel" && st.qn >= DUEL_Q) return endScreen();
    st.qn++; st.locked = false;
    const q = st.q = newQ();
    const order = shuffle(q.choices.map((c, i) => i));
    app.innerHTML = header(scoreBar()) + `
      <main class="game">
        <div class="timebar"><i id="tb"></i></div>
        ${st.mode === "duel" ? `<div class="who ${TEAMS[st.turn].cls}">${TEAMS[st.turn].name} ist dran</div>` : ""}
        <div class="qwrap">
          <div class="qtext">${q.prompt}</div>
          ${q.visual ? `<div class="visual">${q.visual}</div>` : ""}
        </div>
        <div class="answers n${q.choices.length}">
          ${order.map((i, k) => `<button class="ans" data-i="${i}"><span class="k">${k + 1}</span>${q.choices[i]}</button>`).join("")}
        </div>
        <img class="pose corner" src="${P.nachdenken}" alt="">
      </main>
      <div class="fb" id="fb" hidden></div>`;
    wireHeader();
    app.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(+b.dataset.i, b));
    if (st.mode === "duel") { st.tmax = DUEL_T; st.t = DUEL_T; startTimer(); }
    drawTime();
  }

  function answer(i, btn) {
    if (st.locked) return; st.locked = true;
    const q = st.q, ok = i === q.correct;
    app.querySelectorAll(".ans").forEach(b => {
      const bi = +b.dataset.i; b.disabled = true;
      if (bi === q.correct) b.classList.add("right"); else if (b === btn) b.classList.add("wrong");
    });
    beep(ok);
    if (st.mode === "duel") {
      stopTimer();
      if (ok) st.scores[st.turn] += 100 + Math.ceil(st.t) * 5;
      showFeedback(ok, i === -1);
    } else {
      if (ok) { st.blitz.right++; st.blitz.streak++; st.blitz.best = Math.max(st.blitz.best, st.blitz.streak); }
      else { st.blitz.wrong++; st.blitz.streak = 0; }
      if (ok) { setTimeout(() => { if (st.t > 0) nextQuestion(); }, 650); }
      else { stopTimer(); showFeedback(false, false); }
    }
  }

  function showFeedback(ok, timeout) {
    const q = st.q, fb = $("#fb");
    const pts = st.mode === "duel" && ok ? `<div class="pts">+${100 + Math.ceil(st.t) * 5} Punkte</div>` : "";
    fb.innerHTML = `<div class="card ${ok ? "ok" : "no"}">
      <img class="pose fbp" src="${ok ? P.lob : P.achtung}" alt="">
      <div class="fbc">
        <div class="verdict">${timeout ? "Zeit abgelaufen!" : ok ? "Richtig!" : "Leider falsch."}</div>${pts}
        ${ok ? "" : `<div class="sol">Richtige Antwort: <b>${q.choices[q.correct]}</b></div>`}
        <div class="expl">${q.explain}</div>
        ${q.reveal ? `<div class="visual small">${q.reveal}</div>` : ""}
        <button class="next" id="nx">${st.mode === "duel" && st.qn >= DUEL_Q ? "Zum Ergebnis" : "Weiter"}</button>
      </div></div>`;
    fb.hidden = false;
    $("#nx").onclick = () => {
      fb.hidden = true;
      if (st.mode === "duel") { st.turn = 1 - st.turn; nextQuestion(); }
      else { nextQuestion(); startTimer(); }
    };
    $("#nx").focus();
  }

  function endScreen() {
    stopTimer();
    let head, body;
    if (st.mode === "duel") {
      const [a, b] = st.scores;
      head = a === b ? "Unentschieden!" : `${TEAMS[a > b ? 0 : 1].name} gewinnt!`;
      body = `<div class="final">${TEAMS.map((t, i) => `<div class="team ${t.cls}"><span>${t.name}</span><b>${st.scores[i]}</b></div>`).join("")}</div>`;
    } else {
      head = `${st.blitz.right} richtige Antworten!`;
      body = `<div class="final"><div class="team blue"><span>Richtig</span><b>${st.blitz.right}</b></div>
        <div class="team orange"><span>Längste Serie</span><b>${st.blitz.best}</b></div>
        <div class="team grey"><span>Falsch</span><b>${st.blitz.wrong}</b></div></div>`;
    }
    app.innerHTML = header() + `<main class="end"><img class="pose big" src="${P.lob}" alt="">
      <div><h1>${head}</h1>${body}
      <div class="row"><button class="mode" id="again"><b>Nochmal</b><span>gleiches Niveau, neue Fragen</span></button>
      <button class="mode" id="menu"><b>Zum Start</b><span>Niveau oder Spielart ändern</span></button></div></div></main>`;
    wireHeader();
    $("#again").onclick = () => begin(st.mode);
    $("#menu").onclick = startScreen;
  }

  // ---------- Zeit ----------
  function startTimer() {
    stopTimer();
    let last = performance.now();
    st.timer = setInterval(() => {
      const now = performance.now(); st.t = Math.max(0, st.t - (now - last) / 1000); last = now;
      drawTime();
      if (st.t <= 0) {
        stopTimer();
        if (st.mode === "duel") { if (!st.locked) answer(-1, null); }
        else endScreen();
      }
    }, 100);
  }
  function stopTimer() { if (st.timer) clearInterval(st.timer); st.timer = null; }
  function drawTime() {
    const tb = $("#tb"); if (tb) { tb.style.width = (100 * st.t / st.tmax) + "%"; tb.classList.toggle("low", st.t < 8); }
    const bt = $("#bt"); if (bt) bt.textContent = Math.ceil(st.t) + " s";
  }

  document.addEventListener("keydown", (e) => {
    const k = parseInt(e.key, 10);
    if (k >= 1 && k <= 4) { const b = app.querySelectorAll(".ans")[k - 1]; if (b && !b.disabled) b.click(); }
    if (e.key === "Enter") { const n = $("#nx"); if (n && !$("#fb").hidden) n.click(); }
  });

  startScreen();
})();
</script>

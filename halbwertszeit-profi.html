<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halbwertszeit-Profi · Physik 9F</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{--blau:#164A9C;--dblau:#0E2F66;--hblau:#1C69D4;--fblau:#EAF0FA;--orange:#E8833A;--dorange:#B4561A;--horange:#FFF1E4;--rot:#E2231A;--violett:#7A4FD0;--gruen:#2E9E4F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Lexend',system-ui,sans-serif;background:#f4f7fc;color:#1d2433;display:flex;flex-direction:column}
h1,h2,h3,.fred{font-family:'Fredoka','Lexend',sans-serif;font-weight:600}
header{background:var(--dblau);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px}
header img{width:48px;height:48px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#fff}
header .t{font-family:Fredoka;font-weight:600;font-size:clamp(18px,2.6vw,28px)}
header .s{font-size:13px;opacity:.85}
header .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.stripe{height:6px;background:linear-gradient(90deg,var(--hblau) 0 33.3%,var(--dblau) 33.3% 66.6%,var(--rot) 66.6% 100%)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(14,47,102,.12);width:min(1100px,100%);padding:clamp(18px,3vw,36px);position:relative}
.start{display:flex;gap:30px;align-items:center}
.start img{height:clamp(160px,30vh,300px)}
.start h1{color:var(--blau);font-size:clamp(30px,5vw,56px);line-height:1.05}
.start p{margin:12px 0 22px;font-size:clamp(15px,1.8vw,20px);color:#3b4658}
.modes{display:flex;gap:16px;flex-wrap:wrap}
.btn{font-family:Lexend;font-weight:700;border:none;border-radius:16px;padding:18px 26px;font-size:clamp(17px,2vw,22px);cursor:pointer;color:#fff;background:var(--blau);box-shadow:0 4px 0 var(--dblau);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dblau)}
.btn.or{background:var(--orange);box-shadow:0 4px 0 var(--dorange)}
.btn small{display:block;font-weight:400;font-size:13px;opacity:.9;margin-top:4px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.pill{border-radius:999px;padding:8px 16px;font-weight:700;font-size:clamp(14px,1.6vw,18px)}
.team-b{background:var(--hblau);color:#fff}.team-o{background:var(--orange);color:#fff}
.team-b.off,.team-o.off{opacity:.35}
.timer{margin-left:auto;font-family:Fredoka;font-size:clamp(26px,3.4vw,40px);color:var(--dblau);min-width:90px;text-align:right}
.timer.low{color:var(--rot)}
.bar{height:8px;background:#e6ecf6;border-radius:8px;overflow:hidden;margin-bottom:18px}
.bar div{height:100%;background:var(--hblau);transition:width .25s linear}
.q{display:flex;gap:18px;align-items:flex-start}
.q img{height:clamp(110px,18vh,170px)}
.qt{font-size:clamp(20px,2.7vw,32px);line-height:1.35;font-weight:600;color:var(--dblau)}
.qt .iso{color:var(--blau)}
.qnr{font-size:14px;color:#6b7280;margin-bottom:6px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;border:3px solid #c9d6ec;background:var(--fblau);border-radius:16px;padding:16px 18px;font-size:clamp(18px,2.3vw,27px);cursor:pointer;font-family:Lexend;text-align:left;color:#1d2433;min-height:72px}
.opt b{background:var(--dblau);color:#fff;border-radius:10px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.opt:hover{border-color:var(--hblau)}
.opt.ok{border-color:var(--gruen);background:#E8F6EC}.opt.ok b{background:var(--gruen)}
.opt.no{border-color:var(--rot);background:#FDECEC}.opt.no b{background:var(--rot)}
.opt[disabled]{cursor:default}
.fb{display:none;margin-top:20px;border-radius:16px;padding:16px 18px 16px 130px;position:relative;font-size:clamp(16px,1.9vw,21px);line-height:1.5;min-height:110px}
.fb img{position:absolute;left:10px;bottom:0;height:120px}
.fb.ok{background:#E8F6EC;border:2px solid var(--gruen)}
.fb.no{background:#FDECEC;border:2px solid var(--rot)}
.fb .h{font-family:Fredoka;font-weight:600;font-size:clamp(20px,2.4vw,28px)}
.fb.ok .h{color:var(--gruen)}.fb.no .h{color:var(--rot)}
.weiter{margin-top:14px;text-align:right}
.res{text-align:center}
.res img{height:clamp(150px,26vh,260px)}
.res h2{font-size:clamp(28px,4vw,48px);color:var(--blau);margin:8px 0}
.scores{display:flex;gap:20px;justify-content:center;margin:16px 0 24px;flex-wrap:wrap}
.scores div{border-radius:18px;padding:16px 28px;color:#fff;font-size:22px;font-weight:700}
.scores span{display:block;font-family:Fredoka;font-size:44px}
.hint{font-size:13px;color:#6b7280;margin-top:14px}
.home{background:transparent;border:2px solid #fff;color:#fff;border-radius:10px;padding:6px 12px;font-family:Lexend;cursor:pointer;font-size:14px}
@media (max-width:700px){.opts{grid-template-columns:1fr}.start{flex-direction:column;text-align:center}.modes{justify-content:center}.q img{display:none}.fb{padding-left:18px}.fb img{display:none}}
</style>
</head>

// ---------- Zahlen ----------
function fmt(x){
  let r=Math.round(x*1000)/1000;
  let s=r.toString().split('.');
  let i=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return s[1]?i+','+s[1]:i;
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function unit(t,u){ // Einheit mit Singular
  if(u==='Tage') return t===1?'Tag':'Tage';
  if(u==='Jahre') return t===1?'Jahr':'Jahre';
  if(u==='Stunden') return t===1?'Stunde':'Stunden';
  return u;
}
const ISO=[
 {n:'Iod-131',T:8,u:'Tage'},{n:'Radon-222',T:3.8,u:'Tage'},{n:'Polonium-210',T:138,u:'Tage'},
 {n:'Cäsium-137',T:30,u:'Jahre'},{n:'Kohlenstoff-14',T:5730,u:'Jahre'},{n:'Technetium-99m',T:6,u:'Stunden'},
 {n:'Iod-123',T:13.2,u:'Stunden'},{n:'Kobalt-60',T:5.3,u:'Jahre'},{n:'Strontium-90',T:29,u:'Jahre'}];
const treppe=n=>{let s='100 %';for(let k=1;k<=n;k++)s+=' → '+fmt(100/2**k)+' %';return s;};
const treppeN=(N,n)=>{let s=fmt(N);for(let k=1;k<=n;k++)s+=' → '+fmt(N/2**k);return s;};
function opts(correct,cands){
  const set=[correct];
  for(const c of cands){ if(set.length>=4)break; if(c>0 && !set.some(v=>Math.abs(v-c)<1e-9)) set.push(c);}
  let k=2; while(set.length<4){const c=correct*k; if(!set.some(v=>Math.abs(v-c)<1e-9))set.push(c); k++;}
  return set;
}

// ---------- Fragen ----------
const GEN=[
 function prozent(){
  const i=rnd(ISO), n=ri(1,4), t=n*i.T, c=100/2**n;
  const o=opts(c,[100-c,100/2**(n+1),100/2**(n-1),100/(n+1),100-25*n]);
  return {q:`<span class="iso">${i.n}</span> hat eine Halbwertszeit von ${fmt(i.T)} ${unit(i.T,i.u)}. Wie viel Prozent sind nach ${fmt(t)} ${unit(t,i.u)} noch vorhanden?`,
   o:o.map(v=>fmt(v)+' %'), a:0,
   e:`${fmt(t)} : ${fmt(i.T)} = ${n} Halbwertszeit${n>1?'en':''}.<br>${treppe(n)}`};
 },
 function zeit(){
  const i=rnd(ISO), n=ri(1,4), p=100/2**n, c=n*i.T;
  const o=opts(c,[(n+1)*i.T,(n-1)*i.T,i.T/n,(100-p)/50*i.T,i.T*2**n]);
  return {q:`<span class="iso">${i.n}</span> hat eine Halbwertszeit von ${fmt(i.T)} ${unit(i.T,i.u)}. Nach welcher Zeit sind nur noch ${fmt(p)} % vorhanden?`,
   o:o.map(v=>fmt(v)+' '+unit(v,i.u)), a:0,
   e:`${treppe(n)}: ${n} Halbwertszeit${n>1?'en':''}.<br>${n} · ${fmt(i.T)} ${unit(i.T,i.u)} = ${fmt(c)} ${unit(c,i.u)}`};
 },
 function kerne(){
  const N=rnd([800,1600,2000,2400,4000,6400,8000,12000]), n=ri(1,3), i=rnd(ISO), t=n*i.T, c=N/2**n;
  const lin=N-n*N/2;
  const o=opts(c,[N/2**(n+1),N/2**(n-1),lin>0?lin:N/(2*n),N-c,N/(n+1)]);
  return {q:`Eine Probe enthält ${fmt(N)} Kerne <span class="iso">${i.n}</span> (T½ = ${fmt(i.T)} ${unit(i.T,i.u)}). Wie viele Kerne sind nach ${fmt(t)} ${unit(t,i.u)} noch da?`,
   o:o.map(v=>fmt(v)+' Kerne'), a:0,
   e:`${fmt(t)} : ${fmt(i.T)} = ${n} Halbwertszeit${n>1?'en':''}.<br>${treppeN(N,n)}`};
 },
 function zerfallen(){
  const N=rnd([800,1000,1600,2000,4000,8000]), n=ri(1,3), c=N-N/2**n;
  const o=opts(c,[N/2**n,N-N/2**(n+1),N-N/2**(n-1),n*N/2>=N?N/2:n*N/2,N]);
  return {q:`Von ${fmt(N)} radioaktiven Kernen: Wie viele sind nach ${n} Halbwertszeit${n>1?'en':''} <u>zerfallen</u>?`,
   o:o.map(v=>fmt(v)+' Kerne'), a:0,
   e:`Noch vorhanden: ${treppeN(N,n)}.<br>Zerfallen: ${fmt(N)} − ${fmt(N/2**n)} = ${fmt(c)}`};
 },
 function hwz(){
  const N=rnd([400,800,1200,1600,2000,3200,4000]), n=ri(2,3), T=rnd([2,3,4,5,6,8,10]), u=rnd(['Stunden','Tage','Minuten']), t=n*T, R=N/2**n;
  const o=opts(T,[t,t/(n+1),T*2,t/2===T?T+1:t/2]);
  return {q:`Von ${fmt(N)} Kernen sind nach ${fmt(t)} ${u} nur noch ${fmt(R)} übrig. Wie groß ist die Halbwertszeit?`,
   o:o.map(v=>fmt(v)+' '+(u==='Minuten'?(v===1?'Minute':'Minuten'):unit(v,u))), a:0,
   e:`${treppeN(N,n)}: ${n} Halbwertszeiten.<br>T½ = ${fmt(t)} ${u} : ${n} = ${fmt(T)} ${u}`};
 },
 function alter(){
  const n=ri(1,4), p=100/2**n, c=n*5730;
  const o=opts(c,[(n+1)*5730,(n-1)*5730,5730/n,5730*2**n,(100-p)*57.3]);
  return {q:`Ein Knochen enthält nur noch ${fmt(p)} % seines <span class="iso">Kohlenstoffs C-14</span> (T½ = 5 730 Jahre). Wie alt ist er ungefähr?`,
   o:o.map(v=>fmt(v)+' Jahre'), a:0,
   e:`${treppe(n)}: ${n} Halbwertszeit${n>1?'en':''}.<br>${n} · 5 730 Jahre = ${fmt(c)} Jahre`};
 },
 function begriff(){
  const pool=[
   {q:'Was bedeutet „Halbwertszeit“?',r:'Die Zeit, nach der nur noch die Hälfte der Kerne vorhanden ist.',f:['Die Zeit, bis alle Kerne zerfallen sind.','Die halbe Lebensdauer eines einzelnen Atoms.','Die Zeit, in der sich die Anzahl der Kerne verdoppelt.'],e:'Nach einer Halbwertszeit ist die Hälfte der Kerne zerfallen, die andere Hälfte ist noch da.'},
   {q:'Wie viel ist nach 2 Halbwertszeiten noch vorhanden?',r:'ein Viertel',f:['nichts mehr','die Hälfte','ein Drittel'],e:'100 % → 50 % → 25 %. Ein Viertel ist noch da.'},
   {q:'Welche Aussage ist richtig?',r:'Nach jeder Halbwertszeit halbiert sich der Rest.',f:['Nach jeder Halbwertszeit zerfällt die gleiche Anzahl Kerne.','Nach zwei Halbwertszeiten ist der Stoff weg.','Die Halbwertszeit wird mit der Zeit kürzer.'],e:'Es zerfällt immer die Hälfte der <b>noch vorhandenen</b> Kerne. Darum werden es jedes Mal weniger.'},
   {q:'Kann man vorhersagen, wann ein einzelner Atomkern zerfällt?',r:'Nein, das ist Zufall.',f:['Ja, genau nach einer Halbwertszeit.','Ja, wenn man ihn wiegt.','Ja, nach zwei Halbwertszeiten.'],e:'Der Zerfall eines einzelnen Kerns ist zufällig. Die Halbwertszeit gilt nur für sehr viele Kerne.'},
   {q:'Welcher Stoff verliert seine Strahlung am schnellsten?',r:'Technetium-99m (T½ = 6 Stunden)',f:['Cäsium-137 (T½ = 30 Jahre)','Kohlenstoff-14 (T½ = 5 730 Jahre)','Iod-131 (T½ = 8 Tage)'],e:'Je kleiner die Halbwertszeit, desto schneller nimmt die Anzahl der Kerne ab. Darum nutzt man Technetium in der Medizin.'},
   {q:'Wie sieht die Zerfallskurve aus?',r:'Sie fällt erst steil, dann immer flacher.',f:['Sie ist eine fallende Gerade.','Sie fällt erst flach, dann steil.','Sie trifft nach 2 Halbwertszeiten die Zeitachse.'],e:'Am Anfang zerfallen viele Kerne, später immer weniger. Die Kurve berührt die Zeitachse nie.'},
   {q:'Wofür nutzt man Kohlenstoff C-14?',r:'zur Altersbestimmung von Funden',f:['als Brennstoff im Kernkraftwerk','zum Röntgen','zur Messung der Temperatur'],e:'Lebewesen nehmen C-14 auf. Nach dem Tod zerfällt es mit T½ = 5 730 Jahren. Daraus berechnet man das Alter.'},
   {q:'Nach wie vielen Halbwertszeiten sind noch 12,5 % vorhanden?',r:'3',f:['2','4','8'],e:'100 % → 50 % → 25 % → 12,5 %: drei Pfeile, also 3 Halbwertszeiten.'}];
  const p=rnd(pool); const o=[p.r,...p.f];
  return {q:p.q,o,a:0,e:p.e};
 }
];
let lastGen=-1;
function newQ(){
  let g; do{g=ri(0,GEN.length-1);}while(g===lastGen); lastGen=g;
  const q=GEN[g](); const idx=shuffle([0,1,2,3]);
  return {q:q.q,o:idx.map(i=>q.o[i]),a:idx.indexOf(0),e:q.e};
}

// ---------- Spielablauf ----------
let S=null, tick=null;
function stop(){clearInterval(tick);tick=null;}
function startScreen(){
  S=null; homeBtn.style.display='none';
  app.innerHTML=`<div class="start"><img src="${P.winken}" alt=""><div>
  <h1>Halbwertszeit-Profi</h1>
  <p>Wie viel ist noch übrig? Rechne mit der Halbwertszeit und sammle Punkte. Die Fragen sind jedes Mal neu.</p>
  <div class="modes">
   <button class="btn" id="m1">Klassenduell<small>Team Blau gegen Team Orange · 12 Fragen · 40 s</small></button>
   <button class="btn or" id="m2">Blitzrunde<small>120 Sekunden · so viele wie möglich</small></button>
  </div><div class="hint">Tasten: 1–4 zum Antworten, Enter für weiter</div></div></div>`;
  document.getElementById('m1').onclick=()=>begin('duell');
  document.getElementById('m2').onclick=()=>begin('blitz');
}
function begin(mode){
  homeBtn.style.display='';
  S={mode,nr:0,team:0,pts:[0,0],richtig:0,falsch:0,answered:false,left:mode==='duell'?40:120,total:mode==='duell'?40:120};
  if(mode==='blitz'){stop();tick=setInterval(()=>{S.left--;updTimer();if(S.left<=0){stop();result();}},1000);}
  next();
}
function updTimer(){
  const t=document.getElementById('tm'); if(!t)return;
  t.textContent=S.left+' s'; t.classList.toggle('low',S.left<=10);
  const b=document.getElementById('br'); if(b)b.style.width=(100*S.left/S.total)+'%';
}
function next(){
  if(S.mode==='duell'&&S.nr>=12){stop();return result();}
  S.cur=newQ(); S.answered=false; S.nr++;
  if(S.mode==='duell'){S.team=(S.nr-1)%2;S.left=40;stop();tick=setInterval(()=>{S.left--;updTimer();if(S.left<=0){stop();answer(-1);}},1000);}
  render();
}
function render(){
  const q=S.cur;
  const top=S.mode==='duell'
   ?`<span class="pill team-b ${S.team?'off':''}">Team Blau: ${S.pts[0]}</span><span class="pill team-o ${S.team?'':'off'}">Team Orange: ${S.pts[1]}</span>`
   :`<span class="pill team-b">Punkte: ${S.pts[0]}</span><span class="pill" style="background:#E8F6EC;color:#2E9E4F">✓ ${S.richtig}</span>`;
  app.innerHTML=`<div class="top">${top}<span class="timer" id="tm">${S.left} s</span></div>
  <div class="bar"><div id="br" style="width:${100*S.left/S.total}%"></div></div>
  <div class="q"><img src="${P.nachdenken}" alt=""><div><div class="qnr">${S.mode==='duell'?`Frage ${S.nr} von 12 · ${S.team?'Team Orange':'Team Blau'} ist dran`:`Frage ${S.nr}`}</div><div class="qt">${q.q}</div></div></div>
  <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${i+1}</b><span>${o}</span></button>`).join('')}</div>
  <div class="fb" id="fb"></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  if(S.answered)return; S.answered=true; if(S.mode==='duell')stop();
  const q=S.cur, ok=i===q.a;
  app.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('ok');else if(k===i)b.classList.add('no');});
  let plus=0;
  if(ok){S.richtig++; plus=100+(S.mode==='duell'?S.left*5:0); S.pts[S.mode==='duell'?S.team:0]+=plus;} else S.falsch++;
  const fb=document.getElementById('fb'); fb.className='fb '+(ok?'ok':'no'); fb.style.display='block';
  fb.innerHTML=`<img src="${ok?P.lob:P.achtung}" alt=""><div class="h">${ok?`Richtig! +${plus} Punkte`:(i<0?'Zeit ist um!':'Leider falsch.')}</div>
   ${ok?'':`Richtig ist: <b>${q.o[q.a]}</b><br>`}${q.e}
   <div class="weiter"><button class="btn" id="wb">${S.mode==='duell'&&S.nr>=12?'Ergebnis':'Weiter'} ⏎</button></div>`;
  document.getElementById('wb').onclick=next;
  if(S.mode==='blitz'&&S.left<=0)result();
}
function result(){
  stop(); const d=S.mode==='duell';
  let txt, pose=P.lob;
  if(d){const [b,o]=S.pts; txt=b>o?'Team Blau gewinnt!':o>b?'Team Orange gewinnt!':'Unentschieden!';}
  else{txt=`${S.richtig} richtige Antworten!`; if(S.richtig<3)pose=P.zeigen;}
  app.innerHTML=`<div class="res"><img src="${pose}" alt=""><h2>${txt}</h2>
  <div class="scores">${d?`<div style="background:var(--hblau)">Team Blau<span>${S.pts[0]}</span></div><div style="background:var(--orange)">Team Orange<span>${S.pts[1]}</span></div>`
   :`<div style="background:var(--hblau)">Punkte<span>${S.pts[0]}</span></div><div style="background:#2E9E4F">Richtig<span>${S.richtig}</span></div><div style="background:var(--rot)">Falsch<span>${S.falsch}</span></div>`}</div>
  <div class="modes" style="justify-content:center"><button class="btn" id="again">Nochmal spielen ⏎</button><button class="btn or" id="menu">Zum Start</button></div></div>`;
  S.done=true;
  document.getElementById('again').onclick=()=>begin(S.mode);
  document.getElementById('menu').onclick=startScreen;
}
document.addEventListener('keydown',e=>{
  if(!S){ if(e.key==='1')begin('duell'); if(e.key==='2')begin('blitz'); return; }
  if(S.done){ if(e.key==='Enter')begin(S.mode); return; }
  if(!S.answered && ['1','2','3','4'].includes(e.key)) answer(+e.key-1);
  else if(S.answered && e.key==='Enter') next();
});
startScreen();
</script>
</body>
</html>

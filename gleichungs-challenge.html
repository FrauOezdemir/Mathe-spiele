<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10E Gleichungs-Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--kopf:#0E2F66;--blau:#164A9C;--hell:#DCE6F5;--rot:#E2231A;--gruen:#1E7B34;--gelb:#FFEDAA;--A:#C25A12;--B:#5E35B1;--ink:#1B1F24}
*{box-sizing:border-box}
body{margin:0;font-family:Lexend,sans-serif;background:#F4F7FC;color:var(--ink);height:100vh;overflow:hidden}
.kopf{background:var(--kopf);color:#fff;display:flex;align-items:center;padding:10px 22px;gap:18px}
.kopf h1{font-family:Fredoka;font-size:30px;margin:0;flex:1}
.kopf small{display:block;font-family:Lexend;font-size:14px;opacity:.85;font-weight:400}
.team{font-family:Fredoka;font-weight:700;font-size:22px;border-radius:14px;padding:6px 16px;color:#fff;min-width:170px;text-align:center}
.team .pkt{font-size:34px;display:block;line-height:1}
.team.A{background:var(--A)}.team.B{background:var(--B)}
main{height:calc(100vh - 86px);display:flex;flex-direction:column;padding:14px 24px;gap:12px}
.start{margin:auto;text-align:center;max-width:960px}
.start h2{font-family:Fredoka;font-size:52px;color:var(--blau);margin:0 0 10px}
.regeln{background:#fff;border:3.4px solid var(--blau);border-radius:16px;padding:16px 24px;text-align:left;font-size:20px;line-height:1.6}
.knopf{font-family:Fredoka;font-weight:600;font-size:22px;border:none;border-radius:14px;padding:10px 24px;cursor:pointer;background:var(--blau);color:#fff}
.knopf.rot{background:var(--rot)}
.oben{display:flex;align-items:center;gap:16px}
.oben .info{font-family:Fredoka;font-size:22px;color:var(--blau);flex:1}
.uhrzahl{font-family:Fredoka;font-size:34px;color:#fff;background:var(--rot);border-radius:50%;width:64px;height:64px;display:grid;place-items:center}
.mitte{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;flex:1;min-height:0}
.aufgabe{background:#fff;border:3.4px solid var(--blau);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.aufgabe .typ{font-family:Fredoka;font-size:20px;color:#fff;background:var(--blau);align-self:flex-start;border-radius:8px;padding:2px 12px;margin-bottom:10px}
.aufgabe .text{font-size:clamp(22px,2.2vw,34px);line-height:1.4;font-weight:500}
.aufgabe canvas{width:100%;flex:1;min-height:0}
table{border-collapse:collapse;font-size:30px;margin:10px auto;font-family:Fredoka}
td{border:2px solid var(--ink);padding:8px 22px;text-align:center}
td:first-child{background:var(--hell);font-weight:600}
.optionen{display:grid;grid-template-rows:repeat(4,1fr);gap:10px}
.opt{font-family:Fredoka;font-weight:600;font-size:clamp(24px,2.4vw,38px);background:#fff;border:4px solid var(--blau);border-radius:16px;padding:6px 16px;color:var(--blau);display:flex;align-items:center;gap:14px;position:relative}
.opt .bu{background:var(--blau);color:#fff;border-radius:10px;width:46px;height:46px;display:grid;place-items:center;font-size:26px;flex:none}
.opt.richtig{background:#D3F0DA;border-color:var(--gruen);color:var(--gruen)}.opt.richtig .bu{background:var(--gruen)}
.opt .marke{margin-left:auto;display:flex;gap:6px}
.marke span{font-size:18px;color:#fff;border-radius:8px;padding:2px 10px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pad{border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;color:#fff;font-family:Fredoka}
.pad.A{background:var(--A)}.pad.B{background:var(--B)}
.pad .name{font-size:22px;min-width:90px}
.pad button{font-family:Fredoka;font-weight:700;font-size:28px;width:64px;height:56px;border-radius:12px;border:3px solid #fff;background:rgba(255,255,255,.15);color:#fff;cursor:pointer}
.pad button.gew{background:#fff;color:var(--ink)}
.pad .status{font-size:20px;margin-left:auto}
.pad .joker{font-size:16px;width:auto;padding:0 10px}
.pad .joker.an{background:#FFD54A;color:var(--ink)}
.erkl{background:var(--gelb);border:3.4px solid #B07F00;border-radius:14px;padding:10px 18px;font-size:22px;text-align:center;display:none}
.sup{font-size:.6em;vertical-align:super}
.sieger{font-family:Fredoka;font-size:64px;text-align:center;margin-top:60px}

.cartoon{position:fixed;right:18px;bottom:10px;height:30vh;max-height:300px;pointer-events:none;transition:transform .35s;z-index:5}
.cartoon.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6) translateY(40px);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.startbild{display:block;height:230px;margin:0 auto 4px}
</style>
</head>
<body>

  <div class="team B">Team B<span class="pkt" id="pB">0</span></div>
</div>

const mische=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const g=(k,q)=>`f(x) = ${k} · ${q}<span class="sup">x</span>`;
function cart(n){const e=$('cart');if(!n){e.style.display='none';return}e.style.display='block';e.src=IMG[n];e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
const ZEIT=45;
// Runden: s = Situation, g = Graph, t = Tabelle
const RUNDEN=[
 {art:'Situation',text:'Ein Guthaben von <b>500 €</b> wird jährlich mit <b>2 %</b> verzinst.',r:g('500','1,02'),f:[g('500','0,98'),g('500','1,2'),g('2','500')],e:'Zunahme 2 % → q = 1,02; Startwert k = 500.'},
 {art:'Tabelle',tab:[[0,1,2,3],[5,10,20,40]],r:g('5','2'),f:[g('2','5'),g('5','0,5'),g('10','2')],e:'f(0) = 5 = k; jeder Wert wird verdoppelt → q = 2.'},
 {art:'Graph',k:3,q:0.5,r:g('3','0,5'),f:[g('0,5','3'),g('3','2'),g('2','0,5')],e:'Schnittpunkt mit der y-Achse (0 | 3) → k = 3; Graph fällt → q < 1.'},
 {art:'Situation',text:'Ein Patient nimmt <b>150 mg</b> eines Medikaments. Stündlich werden <b>6 %</b> abgebaut.',r:g('150','0,94'),f:[g('150','1,06'),g('150','0,06'),g('150','0,6')],e:'Abnahme 6 % → q = 1 − 0,06 = 0,94.'},
 {art:'Graph',k:1,q:2,r:g('1','2')+' = 2<span class="sup">x</span>',f:['f(x) = 0,5<span class="sup">x</span>','f(x) = 2 · 1<span class="sup">x</span>','f(x) = 3<span class="sup">x</span>'],e:'Punkt (0 | 1) und (1 | 2): jeder Schritt verdoppelt → 2ˣ.'},
 {art:'Situation',text:'Ein Auto kostet <b>30 000 €</b> und verliert jedes Jahr <b>15 %</b> an Wert.',r:g('30 000','0,85'),f:[g('30 000','1,15'),g('30 000','0,15'),g('0,85','30 000')],e:'Wertverlust 15 % → q = 0,85.'},
 {art:'Tabelle',tab:[[0,1,2,3],[80,40,20,10]],r:g('80','0,5'),f:[g('80','2'),g('0,5','80'),g('40','0,5')],e:'f(0) = 80; jeder Wert wird halbiert → q = 0,5.'},
 {art:'Situation',text:'Tschad hat <b>12 Mio.</b> Einwohner. Die Bevölkerung wächst jährlich um <b>2,5 %</b>.',r:g('12','1,025'),f:[g('12','1,25'),g('12','0,975'),g('12','2,5')],e:'2,5 % → q = 1 + 0,025 = 1,025 (nicht 1,25!).'},
 {art:'Graph',k:2,q:1.5,r:g('2','1,5'),f:[g('1,5','2'),g('2','0,5'),g('3','1,5')],e:'y-Achsenabschnitt 2 → k = 2; steigt, f(1) = 3 → q = 1,5.'},
 {art:'Tabelle',tab:[[0,1,2,3],[200,180,162,'145,8']],r:g('200','0,9'),f:[g('200','1,1'),g('180','0,9'),g('200','0,8')],e:'180 : 200 = 0,9 → jedes Jahr 10 % weniger.'},
 {art:'Situation',text:'Bulgarien hatte <b>7,1 Mio.</b> Einwohner. Die Zahl nimmt jährlich um <b>0,6 %</b> ab.',r:g('7,1','0,994'),f:[g('7,1','0,94'),g('7,1','1,006'),g('7,1','0,4')],e:'0,6 % = 0,006 → q = 1 − 0,006 = 0,994.'},
 {art:'Graph',k:4,q:0.5,r:g('4','0,5'),f:[g('4','2'),g('0,5','4'),g('2','0,5')],e:'Schnittpunkt (0 | 4) → k = 4; f(1) = 2 → halbiert → q = 0,5.'},
];
let punkte={A:0,B:0},nr=0,wahl={A:null,B:null},zeitWahl={A:null,B:null},joker={A:true,B:true},jokerAn={A:false,B:false},t=0,timer=null,opts=[],runden=[];
function zeigP(){$('pA').textContent=punkte.A;$('pB').textContent=punkte.B}
function start(){
  zeigP();cart(null);
  $('main').innerHTML=`<div class="start"><img class="startbild" src="${IMG.koordinatensystem}" alt=""><h2>Gleichungs-Challenge</h2>
  <div class="regeln">Ordnet jeder <b>Situation</b>, jedem <b>Graphen</b> und jeder <b>Tabelle</b> die passende Funktionsgleichung zu.<br>
  1. Beide Teams spielen <b>gleichzeitig</b>: Je ein Teamsprecher tippt unten auf dem eigenen Feld A–D. Die Wahl bleibt <b>geheim</b>.<br>
  2. Richtig: <b>2 Punkte</b>. Das <b>schnellere</b> richtige Team bekommt <b>+1 Bonus</b>.<br>
  3. Jedes Team hat <b>einen Joker „Doppelt oder nichts“</b>: richtig ×2, falsch −2.<br>
  4. ${RUNDEN.length} Runden, je ${ZEIT} Sekunden.</div>
  <p><button class="knopf" onclick="runden=mische(RUNDEN.slice(0,6)).concat(mische(RUNDEN.slice(6)));naechste()">Challenge starten!</button></p></div>`;
}
function naechste(){
  if(nr>=runden.length)return ende();
  const R=runden[nr];nr++;wahl={A:null,B:null};zeitWahl={A:null,B:null};jokerAn={A:false,B:false};
  opts=mische([{t:R.r,r:1},...R.f.map(x=>({t:x,r:0}))]);
  let auf='';
  if(R.art==='Situation')auf=`<div class="text">${R.text}</div><div class="text" style="margin-top:14px;color:#6B7A8C;font-size:22px">Welche Gleichung beschreibt die Situation?</div>`;
  if(R.art==='Tabelle')auf=`<table><tr><td>x</td>${R.tab[0].map(v=>`<td>${v}</td>`).join('')}</tr><tr><td>f(x)</td>${R.tab[1].map(v=>`<td>${v}</td>`).join('')}</tr></table><div class="text" style="text-align:center;color:#6B7A8C;font-size:22px">Welche Gleichung passt zur Wertetabelle?</div>`;
  if(R.art==='Graph')auf=`<canvas id="cv"></canvas>`;
  $('main').innerHTML=`<div class="oben"><div class="info">Runde ${nr} / ${runden.length}</div><div class="uhrzahl" id="uhr">${ZEIT}</div></div>
  <div class="mitte"><div class="aufgabe"><span class="typ">${R.art}</span>${auf}</div>
  <div class="optionen">${opts.map((o,i)=>`<div class="opt" id="o${i}"><span class="bu">${'ABCD'[i]}</span><span>${o.t}</span><span class="marke" id="m${i}"></span></div>`).join('')}</div></div>
  <div class="erkl" id="erkl">${R.e}</div>
  <div class="pads">${['A','B'].map(T=>`<div class="pad ${T}"><span class="name">Team ${T}</span>${'ABCD'.split('').map((b,i)=>`<button onclick="waehle('${T}',${i},this)">${b}</button>`).join('')}
    <button class="joker" id="j${T}" ${joker[T]?'':'disabled style="opacity:.35"'} onclick="jok('${T}')">Joker</button><span class="status" id="s${T}">wählt …</span></div>`).join('')}</div>
  <div style="text-align:center"><button class="knopf rot" id="aufl" onclick="aufloesen()">Auflösen</button></div>`;
  if(R.art==='Graph')requestAnimationFrame(()=>zeichne(R.k,R.q));
  t=ZEIT;clearInterval(timer);const t0=Date.now();
  timer=setInterval(()=>{t=ZEIT-Math.floor((Date.now()-t0)/1000);$('uhr').textContent=Math.max(0,t);if(t<=0){clearInterval(timer);aufloesen()}},250);
  window._t0=t0;cart(null);
}
function waehle(T,i,b){
  if(!timer)return;
  wahl[T]=i;zeitWahl[T]=Date.now()-window._t0;
  b.parentNode.querySelectorAll('button:not(.joker)').forEach(x=>x.classList.remove('gew'));b.classList.add('gew');
  $('s'+T).textContent='✔ gewählt ('+(zeitWahl[T]/1000).toFixed(1)+' s)';
  // geheim: nach kurzer Zeit Markierung ausblenden
  setTimeout(()=>{if(timer)b.classList.remove('gew')},600);
  if(wahl.A!==null&&wahl.B!==null){clearInterval(timer);timer=null;setTimeout(aufloesen,400)}
}
function jok(T){if(!joker[T]||!timer)return;jokerAn[T]=!jokerAn[T];$('j'+T).classList.toggle('an',jokerAn[T]);$('j'+T).textContent=jokerAn[T]?'Joker an!':'Joker'}
function aufloesen(){
  if($('aufl').disabled)return;$('aufl').disabled=true;clearInterval(timer);timer=null;
  const ri=opts.findIndex(o=>o.r);$('o'+ri).classList.add('richtig');
  const ok={A:wahl.A===ri,B:wahl.B===ri};
  let schnell=null;if(ok.A&&ok.B)schnell=zeitWahl.A<zeitWahl.B?'A':'B';else if(ok.A)schnell='A';else if(ok.B)schnell='B';
  ['A','B'].forEach(T=>{
    let p=0;
    if(ok[T]){p=2+(schnell===T&&ok.A&&ok.B?1:0);}
    if(jokerAn[T]){joker[T]=false;p=ok[T]?p*2:-2;}
    punkte[T]+=p;
    if(wahl[T]!==null)$('m'+wahl[T]).insertAdjacentHTML('beforeend',`<span style="background:var(--${T})">${T}</span>`);
    $('s'+T).textContent=(wahl[T]===null?'keine Antwort':(ok[T]?'richtig':'falsch'))+' · '+(p>=0?'+':'')+p+' P.'+(schnell===T&&ok.A&&ok.B?' (schneller!)':'')+(jokerAn[T]?' Joker':'');
  });
  zeigP();$('erkl').style.display='block';{const n=ok.A&&ok.B?'jubel':(ok.A||ok.B?'lob':(Math.random()<.5?'ups':'facepalm'));$('erkl').insertAdjacentHTML('afterbegin',`<img src="${IMG[n]}" style="height:120px;vertical-align:middle;margin:-46px 14px -20px 0" alt="">`)}
  $('aufl').outerHTML=`<button class="knopf" onclick="naechste()">${nr>=runden.length?'Zum Ergebnis':'Nächste Runde →'}</button>`;
}
function zeichne(k,q){
  const cv=$('cv');if(!cv)return;const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,xmin=-3,xmax=3,ymin=-1,ymax=8;
  const X=x=>(x-xmin)/(xmax-xmin)*W, Y=y=>H-(y-ymin)/(ymax-ymin)*H;
  c.lineWidth=1;
  for(let x=xmin;x<=xmax;x+=0.5){c.strokeStyle=x%1?'#B9C6DA':'#8EA5C9';c.beginPath();c.moveTo(X(x),0);c.lineTo(X(x),H);c.stroke()}
  for(let y=ymin;y<=ymax;y+=0.5){c.strokeStyle=y%1?'#B9C6DA':'#8EA5C9';c.beginPath();c.moveTo(0,Y(y));c.lineTo(W,Y(y));c.stroke()}
  c.strokeStyle='#1B1F24';c.lineWidth=2.5;c.beginPath();c.moveTo(0,Y(0));c.lineTo(W,Y(0));c.moveTo(X(0),0);c.lineTo(X(0),H);c.stroke();
  c.fillStyle='#1B1F24';c.font='600 17px Lexend';c.textAlign='center';
  for(let x=xmin+1;x<xmax;x++)if(x)c.fillText(x,X(x),Y(0)+22);
  c.textAlign='right';for(let y=1;y<ymax;y++)c.fillText(y,X(0)-8,Y(y)+6);
  c.fillText('x',W-6,Y(0)-8);c.textAlign='left';c.fillText('y',X(0)+8,16);
  c.strokeStyle='#C25A12';c.lineWidth=5;c.beginPath();let st=false;
  for(let x=xmin;x<=xmax;x+=0.02){const y=k*q**x;if(y>ymax+1){st=false;continue}st?c.lineTo(X(x),Y(y)):(c.moveTo(X(x),Y(y)),st=true)}c.stroke();
}
function ende(){
  setTimeout(()=>cart('klatschen'),50);
  const s=punkte.A===punkte.B?'Unentschieden!':'Team '+(punkte.A>punkte.B?'A':'B')+' gewinnt!';
  const f=punkte.A===punkte.B?'var(--blau)':(punkte.A>punkte.B?'var(--A)':'var(--B)');
  $('main').innerHTML=`<div class="sieger" style="color:${f}">🏆 ${s}</div><div style="text-align:center;font-family:Fredoka;font-size:40px">Team A: ${punkte.A} · Team B: ${punkte.B}</div>
  <div style="text-align:center;margin-top:30px"><button class="knopf" onclick="punkte={A:0,B:0};nr=0;joker={A:true,B:true};start()">Neue Challenge</button></div>`;
}
window.addEventListener('resize',()=>{const R=runden[nr-1];if(R&&R.art==='Graph')zeichne(R.k,R.q)});
start();
</script>
</body>
</html>
